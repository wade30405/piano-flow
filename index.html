<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Piano Flow｜琴鍵數字練習</title>
<!--
  PIANO FLOW STANDALONE EXPORT
  無外部依賴的單檔 HTML。要改東西時搜尋這四個標記：
  1. DESIGN      所有畫面樣式
  2. APP DATA    歌曲、頁碼、小節與音符資料（由工具腳本自動重寫，不要手改）
  3. APP LOGIC   音高換算、練習引擎、MIDI
  4. 畫面        版面與各個區塊的產生函式
-->
<style>
/* ==================== DESIGN：從這裡修改外觀 ====================
   版面原則：練琴時雙手在琴上，沒有手可以滑螢幕、也沒有耐心找按鈕。
   所以垂直順序就是使用順序——選曲（頂列）→ 練這一節（主卡）→ 查資料（頁籤）。
   主卡以外的東西一律往下放，絕不放在主卡上方把它推出畫面。 */
:root{
  --ink:#171714;--paper:#f3f0e8;--acid:#d8ff47;--orange:#ff6647;
  --line:#c9c5ba;--muted:#6d6b64;--white:#fff;--wash:#eeeae1;
  --ok:#4a7a15;--ok-bg:#eaf3d8;--bad:#c0341a;--bad-bg:#ffe2d9;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:Arial,"Noto Sans TC","PingFang TC",sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.shell{max-width:1080px;margin:auto;padding:20px max(14px,3vw) 60px}
.footer{padding:40px 0 8px;text-align:center;color:#8b887f;font-size:10px;letter-spacing:.18em}

/* ---------- 頂列：曲目與接琴都在這裡，因為兩者每次開啟都要用 ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;
  padding:9px max(14px,3vw);border-bottom:2px solid var(--ink);
  background:rgba(243,240,232,.96);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:8px;flex:none;font-weight:900}
.brandmark{display:grid;place-items:center;width:29px;height:29px;flex:none;
  border:2px solid var(--ink);border-radius:50%;font-size:10px}
.brand b{font-size:15px;letter-spacing:.01em}
.top-song{flex:1;min-width:0}
.top-song select{width:100%;padding:10px 12px;border:2px solid var(--ink);border-radius:0;
  background:var(--white);color:var(--ink);font:700 15px/1.2 inherit;cursor:pointer}
.conn-btn{flex:none;padding:11px 14px;border:2px solid var(--ink);background:var(--ink);
  color:var(--white);font:700 13px/1 inherit;cursor:pointer;white-space:nowrap}
.conn-btn.on{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.conn-btn:hover{background:var(--orange);border-color:var(--orange);color:#fff}
@media(max-width:620px){.brand b{display:none}.conn-btn em{display:none}}

/* ---------- 練習主卡 ---------- */
.stage{position:relative;margin:18px 0 22px;border:2px solid var(--ink);background:var(--white);
  box-shadow:6px 6px 0 var(--ink)}
.stage-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;
  padding:14px 18px;background:var(--ink);color:var(--white)}
.bar-nav{display:flex;align-items:center;gap:10px}
.bar-nav button{width:42px;height:42px;flex:none;border:2px solid var(--white);
  background:transparent;color:var(--white);font:700 20px/1 inherit;cursor:pointer}
.bar-nav button:hover:not([disabled]){background:var(--acid);color:var(--ink);border-color:var(--acid)}
.bar-nav button[disabled]{opacity:.28;cursor:default}
.bar-now b{display:block;font:400 27px/1 Georgia,"Noto Serif TC",serif}
.bar-now small{display:block;margin-top:4px;font-size:11px;color:#b8b6ad;letter-spacing:.04em}
.stage-head .grow{flex:1}
/* 手位切換：三個階段是有順序的，所以做成一條而不是三顆獨立按鈕 */
.hand-seg{display:flex;border:2px solid var(--white)}
.hand-seg button{padding:8px 13px;border:0;border-right:1px solid rgba(255,255,255,.35);
  background:transparent;color:var(--white);font:700 13px/1.25 inherit;cursor:pointer;text-align:center}
.hand-seg button:last-child{border-right:0}
.hand-seg button.on{background:var(--acid);color:var(--ink)}
.hand-seg button small{display:block;font-size:9px;font-weight:400;opacity:.75}
.hand-seg button.on small{opacity:.6}
.stage-body{padding:18px}

/* ---------- 這一小節的進度：本程式的核心，做大 ---------- */
.meter{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.meter-track{flex:1;height:8px;background:var(--wash);border:1px solid var(--line)}
.meter-track i{display:block;height:100%;background:var(--ok);transition:width .18s}
.meter b{font-size:13px;letter-spacing:.03em}
.meter .rep{font-size:12px;color:var(--muted)}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.step{position:relative;min-width:68px;min-height:68px;padding:9px 9px 17px;
  border:2px solid var(--line);background:var(--white);color:var(--ink);
  text-align:center;cursor:pointer}
.step .n{display:block;font:700 21px/1.15 Georgia,serif}
.step .n i{padding:0 2px;font-size:.52em;font-style:normal;opacity:.5}
.step .s{display:block;margin-top:3px;font-size:10px;color:var(--muted)}
/* 橫條長度＝這個音要按多久 */
.step .dur{position:absolute;left:7px;bottom:7px;height:4px;border-radius:2px;
  background:var(--ink);opacity:.3}
.step.done{border-color:var(--ok);background:var(--ok-bg)}
.step.done::after{content:'✓';position:absolute;top:1px;right:5px;font:900 13px/1 inherit;color:var(--ok)}
.step.now{border-color:var(--ink);background:var(--acid);box-shadow:inset 0 0 0 3px var(--ink)}
.step.now .s{color:#4a4a3a}
.step.bad{border-color:var(--bad);background:var(--bad-bg);animation:shake .28s}
.step.demo{border-color:var(--orange);background:#fff0d9}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
/* 雙手：兩手排在同一條時間軸上，直向對齊就看得出誰跟誰同時 */
.steps.two{display:block}
.strow{display:flex;align-items:stretch;gap:5px;margin-bottom:5px;overflow-x:auto;padding-bottom:2px}
.strow-label{display:flex;align-items:center;flex:none;min-width:46px;padding:0 8px;
  background:var(--ink);color:var(--white);font:700 12px/1 inherit}
.strow .step{flex:1;min-width:62px}
.step .hold{color:var(--muted);opacity:.55}

/* ---------- 現在要按哪個鍵 ---------- */
.target{display:flex;align-items:center;gap:16px;margin:0 0 14px;padding:14px 16px;
  border:2px solid var(--ink);background:var(--acid)}
.target-key{display:grid;place-items:center;flex:none;width:98px;height:98px;
  border:2px solid var(--ink);background:var(--white);color:var(--ink)}
.target-key b{font:700 42px/1 Georgia,serif}
.target-key small{margin-top:3px;font-size:10px;color:var(--muted);letter-spacing:.06em}
.target-key.blk{background:var(--ink);color:var(--white)}
.target-key.blk b{font-size:30px}
.target-key.blk small{color:#b8b6ad}
.target-say{min-width:0}
.target-say b{display:block;font-size:21px;line-height:1.35}
.target-say small{display:block;margin-top:5px;font-size:13px;color:#3f4030}
.target.wrong{background:var(--bad-bg);border-color:var(--bad)}
.target.wrong .target-say b{color:var(--bad)}
.target.rest{background:var(--wash)}

/* ---------- 小節完成 ---------- */
.done-banner{position:relative;margin:0 0 14px;padding:15px 17px;
  border:2px solid var(--ok);background:var(--ok-bg);overflow:hidden}
.done-banner b{display:block;font-size:21px;color:var(--ok)}
.done-banner p{margin:5px 0 0;font-size:14px;line-height:1.6;color:#3f4a2a}
.done-banner .cd{position:absolute;left:0;bottom:0;height:5px;background:var(--ok);
  animation:cd 1.4s linear forwards}
@keyframes cd{from{width:0}to{width:100%}}
.done-banner.end{border-color:var(--orange);background:#fff0d9}
.done-banner.end b{color:var(--orange)}
.banner-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.banner-btns button{padding:10px 15px;border:2px solid var(--ink);background:var(--white);
  color:var(--ink);font:700 13px/1 inherit;cursor:pointer}
.banner-btns button.main{background:var(--ink);color:var(--white)}

/* ---------- 手位與節奏提示：兩行字而已，不值得收合 ---------- */
.hint{margin:0 0 14px;padding:11px 14px;border-left:4px solid var(--orange);
  background:#fdf3ef;color:#4d4b44;font-size:13px;line-height:1.65}
.hint.ok{border-left-color:var(--ok);background:var(--ok-bg)}
.hint b{color:var(--ink)}

/* ---------- 練習條：反覆＋速度＋熟練度合成一條 ---------- */
.stage-foot{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;
  padding:13px 18px;border-top:2px solid var(--ink);background:var(--wash)}
.foot-item{display:flex;align-items:center;gap:8px;min-width:0}
.foot-item>label{flex:none;font-size:11px;color:var(--muted);letter-spacing:.05em}
.seg{display:flex;border:1px solid var(--ink);background:var(--white)}
.seg button{padding:8px 11px;border:0;border-right:1px solid var(--line);
  background:transparent;color:var(--ink);font:600 13px/1 inherit;cursor:pointer;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--acid);font-weight:800}
.seg button.lv2.on{background:var(--ok);color:var(--white)}
.foot-item input[type=range]{width:110px;accent-color:var(--orange)}
.ghost{padding:7px 11px;border:1px dashed var(--line);background:transparent;
  color:var(--muted);font:400 12px/1 inherit;cursor:pointer}
.ghost.on{border-style:solid;border-color:var(--ink);background:var(--acid);
  color:var(--ink);font-weight:700}
.demo-btn{padding:11px 17px;border:2px solid var(--ink);background:var(--ink);
  color:var(--white);font:700 14px/1 inherit;cursor:pointer}
.demo-btn.on{background:var(--orange);border-color:var(--orange)}

/* ---------- 鍵盤 ---------- */
.piano-wrap{margin:0 0 14px}
.range-label{margin-bottom:7px;color:var(--muted);font-size:10px;letter-spacing:.07em}
.piano{position:relative;display:flex;width:100%;height:150px;
  border:2px solid var(--ink);background:#111}
.white-key{position:relative;flex:1;min-width:0;border:0;border-right:1px solid #8a8a80;
  background:#fbfaf5;color:var(--ink);cursor:pointer}
.white-key span{position:absolute;right:0;bottom:8px;left:0}
.white-key b,.white-key small{display:block}
.white-key b{font-size:14px}
.white-key small{font-size:9px;color:#8a8880}
/* 這一小節等一下會用到的鍵，先淡淡標起來，眼睛才知道手該擺哪 */
.white-key.inbar{background:#e9eed2}
.white-key.active{background:var(--acid);box-shadow:inset 0 0 0 3px var(--ink)}
.white-key.ok{background:#b9e07a}
.white-key.bad{background:#ffb3a0}
.black-key{position:absolute;top:0;z-index:2;width:24px;height:60%;border:0;
  border-radius:0 0 3px 3px;background:#171714;transform:translateX(-50%);cursor:pointer}
.black-key.inbar{background:#4a5230}
.black-key.active{background:var(--orange)}
.black-key.ok{background:var(--ok)}
.black-key.bad{background:var(--bad)}

/* ---------- 頁籤：參考資料放主卡下面，要看它是一個刻意的動作 ---------- */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border:2px solid var(--ink);
  border-bottom:0;background:var(--ink);gap:2px}
.tabs button{padding:13px 8px;border:0;background:var(--wash);color:var(--ink);
  font:700 14px/1.2 inherit;cursor:pointer}
.tabs button small{display:block;margin-top:3px;font-size:10px;font-weight:400;color:var(--muted)}
.tabs button.on{background:var(--white)}
.tabs button.on small{color:#4d4b44}
.tabpane{border:2px solid var(--ink);background:var(--white)}
.pane-pad{padding:18px}
@media(max-width:620px){.tabs{grid-template-columns:1fr 1fr}.tabs button small{display:none}}

/* ---------- 小節目錄 ---------- */
.cat-head{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:baseline;
  padding:15px 18px;border-bottom:1px solid var(--line);background:var(--wash)}
.cat-head b{font-size:16px}
.cat-head span{color:var(--muted);font-size:12px}
.cat-legend{display:flex;flex-wrap:wrap;gap:12px;padding:9px 18px;
  border-bottom:1px solid var(--line);color:var(--muted);font-size:11px}
.cat-legend i{display:inline-block;width:11px;height:11px;margin-right:4px;
  border:1px solid var(--line);vertical-align:-1px;font-style:normal}
.page-block{background:var(--wash);border-top:1px solid var(--line)}
.page-label{display:flex;justify-content:space-between;padding:10px 16px;font-size:12px}
.page-label b{display:block}
.page-label small{color:var(--muted)}
.measure-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:1px;background:var(--line)}
.measure-grid button{min-width:0;min-height:70px;padding:8px;border:0;
  background:var(--white);color:var(--ink);text-align:left;cursor:pointer}
.measure-grid.keys{grid-template-columns:repeat(4,1fr)}
.measure-grid.keys button{min-height:64px;padding:9px 10px}
.measure-grid small,.measure-grid b,.measure-grid span{display:block}
.measure-grid small{font-size:9px;color:#8a8880}
.measure-grid b{margin:5px 0;font:700 23px/1 Georgia}
.measure-grid span{overflow:hidden;color:#777;font-size:9px;white-space:nowrap;text-overflow:ellipsis}
.measure-grid button.lv1{background:#fbfde8}
.measure-grid button.lv2{background:var(--ok-bg)}
.measure-grid button.lv2 .kc-bar::after{content:'　✓ 已熟';color:var(--ok);font-weight:700}
.measure-grid button.selected{background:var(--orange);color:#fff;box-shadow:inset 0 0 0 3px var(--ink)}
.measure-grid button.selected small,.measure-grid button.selected span{color:#fff}
/* 正在播放的小節：只加外框，不動版面，才不會在播放中造成整頁重排 */
.measure-grid button.playing{outline:3px solid var(--orange);outline-offset:-3px}
.kc-row{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
/* color 一定要寫死。選中的格子會把文字改成白色，白底的白鍵編號就會整個消失 */
.kc{display:inline-flex;align-items:center;justify-content:center;min-width:25px;height:25px;
  padding:0 5px;border:1px solid var(--ink);border-radius:4px;background:var(--white);
  color:var(--ink);font:700 14px/1 inherit;font-style:normal}
/* 黑鍵在琴上沒有印數字，所以標「夾住它的兩個白鍵」，並用黑底對應實體黑鍵 */
.kc.blk{background:var(--ink);color:var(--white);font-size:11px;letter-spacing:-.2px}
.kc.rest{border-style:dashed;background:transparent;color:var(--muted);font-weight:400}
.measure-grid button.selected .kc.rest{color:#fff;border-color:#fff}
.measure-grid.keys button.selected .kc{border-color:var(--ink)}
.kc-bar{font-size:11px;color:var(--muted);letter-spacing:.04em}
/* 同時要按的鍵疊成一直行，跟「先後按」在視覺上分開 */
.kc-stack{display:inline-flex;flex-direction:column;gap:2px;padding:2px;
  border:1px solid var(--muted);border-radius:5px}

/* ---------- 曲譜 ---------- */
.page-tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:1px;background:var(--line)}
.page-tabs button{min-height:56px;padding:9px;border:0;background:var(--wash);
  color:var(--ink);text-align:left;cursor:pointer}
.page-tabs button.on{background:var(--acid)}
.page-tabs small,.page-tabs b{display:block}
.page-tabs small{font-size:10px;color:var(--muted)}
.page-tabs button.on small{color:#4a4a3a}
.score-image{max-height:900px;padding:12px;overflow:auto;background:#d8d5ce;text-align:center}
.score-image img{max-width:100%;height:auto;background:#fff;box-shadow:0 6px 22px #0003}
.score-image.zoom img{width:1350px;max-width:none}
.score-controls{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px;padding:13px}
.score-controls button{min-height:46px;border:2px solid var(--ink);background:var(--white);
  color:var(--ink);font:700 14px/1.2 inherit;cursor:pointer}
.score-controls button[disabled]{opacity:.35;cursor:default}
.score-controls .main{background:var(--acid)}

/* ---------- 自動彈奏 ---------- */
.auto-row{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:11px}
.auto-row label{color:var(--muted);font-size:13px}
.auto-row input[type=number]{width:78px;padding:8px;border:2px solid var(--ink);border-radius:0;
  background:var(--paper);color:var(--ink);font:700 15px/1 inherit}
.auto-opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.auto-opts button{padding:9px 13px;border:1px solid var(--ink);background:var(--paper);
  color:var(--ink);font:600 13px/1 inherit;cursor:pointer}
.auto-opts button.on{background:var(--acid);font-weight:700}
.auto-opts button[disabled]{opacity:.4;cursor:default}
.auto-go{display:grid;grid-template-columns:1.6fr 1fr;gap:8px;margin-top:13px}
.auto-go button{min-height:50px;padding:11px;border:2px solid var(--ink);background:var(--paper);
  color:var(--ink);font:700 15px/1.3 inherit;cursor:pointer}
.auto-go button.main{background:var(--ink);color:var(--white)}
.auto-go button.main.on{background:var(--orange);border-color:var(--orange)}
.auto-go button[disabled]{opacity:.4;cursor:default}
.auto-status{margin-top:11px;padding:11px 13px;border:1px solid var(--line);
  background:var(--paper);font:400 14px/1.4 inherit}
.auto-status b{font-size:17px}
.auto-status small{display:block;margin-top:4px;color:var(--muted);font-size:12px}
.auto-track{position:relative;height:9px;margin-top:8px;background:#e6e3da;overflow:hidden}
.auto-track i{position:absolute;left:0;top:0;height:100%;background:var(--orange)}
.auto-tip{margin:9px 0 0;color:var(--muted);font-size:12px;line-height:1.65}

/* ---------- 接琴與設定 ---------- */
.midi{padding:14px 16px;border:1px solid var(--line);background:var(--white);margin-bottom:12px}
.midi.on{border:2px solid var(--ok);background:var(--ok-bg)}
.midi.warn{border-left:4px solid var(--orange);background:#fdf3ef}
.midi-head{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:baseline}
.midi-head b{font-size:16px}
.midi-head span{color:var(--muted);font-size:12px}
.midi-tip{margin:8px 0 0;color:#4d4b44;font-size:13px;line-height:1.7}
.midi-bad{margin:8px 0 0;padding:8px 10px;background:var(--bad-bg);
  border-left:3px solid var(--orange);font-size:14px;font-weight:700}
.midi-stat{margin-top:9px;font-size:15px;font-weight:700}
.midi-opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.midi-opts button,.midi>button{padding:9px 13px;border:1px solid var(--ink);
  background:var(--paper);color:var(--ink);font:600 13px/1 inherit;cursor:pointer}
.midi-opts button.on{background:var(--acid);font-weight:700}
.midi-out{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.midi-out>b{display:block;margin-bottom:8px;font-size:14px}
.midi>button.main{margin-top:10px;padding:12px 18px;background:var(--ink);
  color:var(--white);font-size:15px;font-weight:700}

.notice{padding:15px 18px;background:#fff0d9;border:2px solid var(--orange);
  color:var(--ink);line-height:1.6}
.hidden{display:none!important}

@media(max-width:700px){
  .stage{box-shadow:4px 4px 0 var(--ink)}
  .stage-head{padding:12px 14px}
  .stage-body{padding:14px}
  .hand-seg{width:100%}
  .hand-seg button{flex:1}
  .target{flex-direction:column;align-items:flex-start;gap:12px}
  .target-key{width:100%;height:86px}
  .measure-grid{grid-template-columns:repeat(5,1fr)}
  .measure-grid.keys{grid-template-columns:1fr 1fr}
  .score-controls{grid-template-columns:1fr 1fr}
  .score-controls .main{grid-column:1/-1;grid-row:1}
  .piano{height:120px}
}
/* 平板橫放架在琴上：只留「現在要按什麼」，其餘全部讓位 */
@media(orientation:landscape) and (max-height:620px){
  .topbar,.tabs,.tabpane,.footer,.hint,.stage-foot{display:none!important}
  .shell{max-width:none;padding:4px}
  .stage{margin:0;border-width:1px;box-shadow:none}
  .stage-head{padding:6px 10px}
  .bar-now b{font-size:19px}
  .bar-now small{display:none}
  .stage-body{padding:8px}
  .target{padding:8px 10px;margin-bottom:8px}
  .target-key{width:66px;height:66px}
  .target-key b{font-size:30px}
  .target-say b{font-size:16px}
  .steps{margin-bottom:8px}

/* ---------- 音高換算 ---------- */
function normalize(note){return note.replace("Db","C#").replace("Eb","D#").replace("Gb","F#").replace("Ab","G#").replace("Bb","A#")}
function midi(note){const n=normalize(note);return(Number(n.slice(-1))+1)*12+NAMES.indexOf(n.slice(0,-1))}
function noteFromMidi(value){return NAMES[value%12]+(Math.floor(value/12)-1)}
function isBlack(note){return normalize(note).includes("#")}
function whiteNumber(note){let count=0;for(let key=21;key<=midi(note);key++)if(!NAMES[key%12].includes("#"))count++;return count}
function numberLabel(note){return isBlack(note)?whiteNumber(note)+"–"+(whiteNumber(note)+1)+"黑":String(whiteNumber(note))}
function keyLabel(note){return isBlack(note)?"白鍵 "+whiteNumber(note)+" 與 "+(whiteNumber(note)+1)+" 中間的黑鍵":"白鍵 "+whiteNumber(note)+" 號"}
function pageForBar(pages,bar){return Math.max(0,pages.findIndex(function(p){return bar>=p.start&&bar<=p.end}))}
function degreeLabel(degree){return degree[0]==="l"?"低"+degree.slice(1):degree[0]==="h"?"高"+degree.slice(1):degree}

/* ---------- 發聲 ---------- */
function playPiano(note,duration){
  duration=duration||.55;
  const Audio=window.AudioContext||window.webkitAudioContext;
  const ctx=playPiano.ctx||(playPiano.ctx=new Audio());
  const m=midi(note);
  const frequency=440*Math.pow(2,(m-69)/12);
  /* 人耳對低頻遠不如中高頻敏感（等響曲線），全部用同一個振幅的話，
     左手的低音會被右手旋律蓋掉，聽起來像「有按跟沒按一樣」。
     這裡依音高補償：越低的音給越大的增益。 */
  const boost=Math.min(2.6,Math.pow(2,Math.max(0,60-m)/26));
  const peak=Math.min(.40,.20*boost);
  /* 低音再多疊兩個泛音。純正弦的低音很悶，加了泛音才聽得出音高輪廓 */
  const parts=m<54?[[1,1],[2,.5],[3,.26],[4,.12]]:[[1,1],[2,.22],[3,.08]];
  const master=ctx.createGain();
  master.gain.setValueAtTime(.0001,ctx.currentTime);
  master.gain.exponentialRampToValueAtTime(peak,ctx.currentTime+.012);
  master.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+duration);
  parts.forEach(function(p){
    const osc=ctx.createOscillator(),gain=ctx.createGain();
    osc.type="sine";osc.frequency.value=frequency*p[0];
    gain.gain.value=p[1];
    osc.connect(gain).connect(master);
    osc.start();osc.stop(ctx.currentTime+duration+.03)});
  master.connect(ctx.destination)}

/* 節拍器：短促的高頻點擊，跟琴聲分得開 */
function tick(strong){
  const A=window.AudioContext||window.webkitAudioContext;
  const ctx=playPiano.ctx||(playPiano.ctx=new A());
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type='square';o.frequency.value=strong?1600:1100;
  g.gain.setValueAtTime(.0001,ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(strong?.10:.05,ctx.currentTime+.003);
  g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.06);
  o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.08)}

/* ---------- 鍵盤 ---------- */
function keyRange(active,notes){
  /* 只顯示這一小節真正用得到的音域。整排 88 鍵得左右滑才看得完，
     但彈琴時雙手都在琴上，沒有手可以滑螢幕——所以鍵盤必須一屏看完。 */
  const used=(notes||[]).concat(active||[]).filter(Boolean);
  if(!used.length)return[1,52];
  const ws=used.map(whiteNumber);
  let w0=Math.min.apply(null,ws)-2;
  let w1=Math.max.apply(null,used.map(function(n){return whiteNumber(n)+(isBlack(n)?1:0)}))+2;
  const MIN=11;/* 太窄會失去方位感，至少給一個八度多一點 */
  if(w1-w0+1<MIN){const pad=Math.ceil((MIN-(w1-w0+1))/2);w0-=pad;w1+=pad}
  if(w0<1){w1+=1-w0;w0=1}
  if(w1>52){w0-=w1-52;w1=52}
  return[Math.max(1,w0),Math.min(52,w1)]}

/* opts：{active 現在該按的, inbar 這一小節會用到的, ok 已經按對的, bad 剛才按錯的} */
function keyboard(opts){
  const o=opts||{};
  const act=(o.active||[]).filter(Boolean);
  const on={};act.forEach(function(n){on[normalize(n)]=1});
  const okOn={};(o.ok||[]).forEach(function(n){if(n)okOn[normalize(n)]=1});
  const badOn={};(o.bad||[]).forEach(function(n){if(n)badOn[normalize(n)]=1});
  const inBar={};(o.inbar||[]).forEach(function(n){if(n)inBar[normalize(n)]=1});
  const all=Array.from({length:88},function(_,i){return noteFromMidi(i+21)});
  const r=keyRange(act,o.inbar),w0=r[0],w1=r[1],span=w1-w0+1;
  const whites=all.filter(function(n){return!isBlack(n)&&whiteNumber(n)>=w0&&whiteNumber(n)<=w1});
  const blacks=all.filter(function(n){return isBlack(n)&&whiteNumber(n)>=w0&&whiteNumber(n)<w1});
  const cls=function(n){const k=normalize(n);
    return badOn[k]?' bad':okOn[k]?' ok':on[k]?' active':inBar[k]?' inbar':''};
  return '<div class="piano-wrap"><div class="range-label">白鍵 '+w0+'–'+w1+'　·　中央 C 是 24　·　'
    +(span<52?'只顯示這一小節用得到的琴鍵，不必左右滑動':'完整 88 鍵')
    +'　·　沒接琴時，直接用滑鼠點鍵盤也算你按了</div>'
    +'<div class="piano">'
    +whites.map(function(n){return '<button class="white-key'+cls(n)+'" data-action="key" data-note="'+n
      +'"><span><b>'+whiteNumber(n)+'</b><small>'+n+'</small></span></button>'}).join('')
    +blacks.map(function(n){return '<button aria-label="'+keyLabel(n)+'" class="black-key'+cls(n)
      +'" style="left:'+((whiteNumber(n)-w0+1)/span*100)+'%" data-action="key" data-note="'+n+'"></button>'}).join('')
    +'</div></div>'}

function impChords(song,bar,hand){const b=impBar(song,bar);return (b[hand]||[]).slice()}
function impTimes(song,bar,hand){const b=impBar(song,bar);return (b[hand==='rh'?'rt':'lt']||[]).slice()}

/* ---------- 統一的「目前這首曲子」介面 ----------
   內建的一生所愛存的是簡譜級數、沒有左手也沒有時值；匯入曲目存的是音名。
   兩者在這裡收斂成同一組問答，上層的畫面只認 kind 這個字串。 */
function curKind(){return state.song==='lifelong'?'life':state.song}
function curSong(){
  if(state.song.slice(0,4)==='imp:')return impCurrent();
  return {id:'lifelong',title:'一生所愛',key:'1＝G',totalBars:114,
          pages:DATA.lifelongPages,life:true}}
function curBar(){const s=curSong();if(!s)return 1;
  return Math.max(1,Math.min(s.totalBars,state.impBar))}
function lifeSteps(bar){return DATA.lifelongBars[bar-1].map(function(d){return{degree:d,note:DEGREE_NOTE[d]}})}

/* 不管哪一首曲子，都用這個介面拿「某一小節要按哪些音」 */
function rawBarChords(kind,bar,hand){
  if(kind.slice(0,4)==='imp:'){const s=impSong(kind.slice(4));return s?impChords(s,bar,hand):[]}
  if(kind==='life')return hand==='rh'?lifeSteps(bar).map(function(s){return [s.note]}):[];
  return []}

/* ---------- 只彈白鍵模式 ----------
   新手要先能彈完整首，黑鍵是門檻。做法不是把黑鍵音硬推到隔壁白鍵——那會
   破壞旋律；而是「整首移調」。移調不改變任何音程關係，聽起來是同一首歌，
   只是整體高低不同，卻可以讓幾乎所有音落在白鍵上。 */
function allNotesOf(kind){
  const out=[];const total=kind==='life'?114:(impSong(kind.slice(4))||{totalBars:0}).totalBars;
  for(let b=1;b<=total;b++)['rh','lh'].forEach(function(h){
    rawBarChords(kind,b,h).forEach(function(ch){ch.forEach(function(n){if(n)out.push(n)})})});
  return out}
const _shiftCache={};
function whiteShift(kind){
  if(_shiftCache[kind]!==undefined)return _shiftCache[kind];
  const ns=allNotesOf(kind);
  let best=0,bestBlack=Infinity;
  for(let t=-6;t<=6;t++){
    let blk=0;
    ns.forEach(function(n){if(isBlack(noteFromMidi(midi(n)+t)))blk++});
    if(blk<bestBlack||(blk===bestBlack&&Math.abs(t)<Math.abs(best))){bestBlack=blk;best=t}}
  return _shiftCache[kind]=best}
function toWhite(note,shift){
  let m=midi(note)+shift;
  /* 移調後仍在黑鍵的（多半是臨時記號），吸附到下方白鍵 */
  if(isBlack(noteFromMidi(m)))m-=1;
  return noteFromMidi(m)}
function isWhiteOnly(kind){
  if(kind.slice(0,4)==='imp:'){const s=impSong(kind.slice(4));return !!(s&&s.whiteOnly)}
  return !!state.white}
/* 入門模式：把「八度加厚」的旋律壓成單音，讓新手一次只按一個鍵 */
function isMelodyOnly(kind){
  if(kind.slice(0,4)==='imp:'){const s=impSong(kind.slice(4));return !!(s&&s.melodyOnly)}
  return false}
function topNote(chord){
  let best=chord[0];
  chord.forEach(function(n){if(midi(n)>midi(best))best=n});
  return best}
/* 這一疊音是不是「同一個音名、只差八度」？
   八度加厚拿掉一個不會改變任何和聲，可以安全壓成單音；
   但真正的和弦（不同音名）一旦只留最高音，和聲就整個消失。 */
function isOctaveStack(chord){
  if(chord.length<2)return false;
  const pc=midi(chord[0])%12;
  return chord.every(function(n){return midi(n)%12===pc})}

function barChords(kind,bar,hand){
  let chords=rawBarChords(kind,bar,hand);
  if(!chords.length)return chords;
  if(isMelodyOnly(kind)&&hand==='rh')
    chords=chords.map(function(ch){return isOctaveStack(ch)?[topNote(ch)]:ch});
  if(isWhiteOnly(kind)){
    const sh=whiteShift(kind);
    chords=chords.map(function(ch){return ch.map(function(n){return toWhite(n,sh)})})}
  return chords}
/* 攤平版：只給「這一小節用到哪些鍵」這類不在意同時性的地方用 */
function barNotes(kind,bar,hand){
  return barChords(kind,bar,hand).reduce(function(a,ch){return a.concat(ch)},[])}

/* ---------- 節奏 ----------
   樂譜排版遵循比例間距：音符的水平距離與它的時值成正比。所以「相鄰兩個
   和弦的位置差」就是前一個音的相對長度，不必再去解析符桿與符尾。 */
function beatSpans(kind,bar,hand){
  const s=impSong(kind.slice(4));
  if(!s)return [];
  const t=impTimes(s,bar,hand);
  if(!t.length)return [];
  const out=[];
  for(let i=0;i<t.length;i++){
    const end=(i+1<t.length)?t[i+1]:1;
    out.push(Math.max(0.01,end-t[i]));
  }
  /* 除以最短的那個音，得到「幾倍長」——1 倍、2 倍、3 倍（附點）之類 */
  const min=Math.min.apply(null,out);
  return out.map(function(v){return v/min})}
function beatLabel(ratio){
  if(ratio>=3.4)return {w:4,name:'很長'};
  if(ratio>=2.6)return {w:3,name:'長（附點）'};
  if(ratio>=1.7)return {w:2,name:'長'};
  if(ratio>=1.3)return {w:1.5,name:'稍長'};
  return {w:1,name:'短'}}

/* 雙手對照：把左右手排到同一條時間軸上。
   兩手的拍數常常不同（右手八個八分音符、左手一個全音符），所以是以
   右手每一拍為準，去找左手在那個時刻「正按著」哪個和弦——也就是
   時間點在它之前、最靠近的那一個。左手按下去後會一直持續，
   不是每次右手動它就要重按。 */
function twoHandSteps(kind,bar){
  const s=impSong(kind.slice(4));
  if(!s)return [];
  const rh=barChords(kind,bar,'rh'), lh=barChords(kind,bar,'lh');
  const rt=impTimes(s,bar,'rh'), lt=impTimes(s,bar,'lh');
  const lead=rh.length?'rh':'lh';
  const steps=[];
  const primary=lead==='rh'?rh:lh, ptimes=lead==='rh'?rt:lt;
  primary.forEach(function(ch,i){
    const t=ptimes[i]!==undefined?ptimes[i]:i/Math.max(1,primary.length);
    let other=null, isNew=false;
    const oc=lead==='rh'?lh:rh, ot=lead==='rh'?lt:rt;
    for(let k=0;k<oc.length;k++){
      const kt=ot[k]!==undefined?ot[k]:k/Math.max(1,oc.length);
      if(kt<=t+0.02){other=oc[k];isNew=Math.abs(kt-t)<=0.02}
    }
    steps.push(lead==='rh'
      ? {rh:ch, lh:other, lhNew:isNew, rhNew:true, t:t}
      : {rh:other, lh:ch, rhNew:isNew, lhNew:true, t:t});
  });
  return steps}

/* ---------- 一小節切成幾「步」----------
   這是整個練習迴圈的單位。一步 = 同一個時間點要按下去的所有鍵。
   雙手模式下，左手若是「繼續壓著」就不算要按的鍵——重按會把長音打斷，
   而且會讓使用者以為自己彈錯。 */
function practiceSteps(kind,bar,hand){
  if(hand==='both'){
    return twoHandSteps(kind,bar).map(function(s){
      return {keys:[].concat(s.rh||[],s.lhNew?(s.lh||[]):[]),
              rh:s.rh||[],lh:s.lh||[],lhNew:!!s.lhNew}})}
  const cs=barChords(kind,bar,hand);
  return cs.map(function(ch){
    return {keys:ch,rh:hand==='rh'?ch:[],lh:hand==='lh'?ch:[],lhNew:true}})}
function curSteps(){return practiceSteps(curKind(),curBar(),state.hand)}

/* ==================== 練習引擎 ====================
   以前的做法是「亮一個鍵 → 你按 → 發出聲音」，然後就沒有然後了。
   那學到的只是「按一個鍵」，不是一句樂句。真正練琴的最小單位是**一個小節**：
   看得到這節共幾步、走到第幾步、走完會有明確的完成訊號，並自動接下一節。

   狀態機：
     等你按 → 按對就前進一步 → 走完整節 → 完成橫幅 → 依「重複次數」原地重來或前進
   按錯不前進，而是明講你按到了哪個鍵——不然使用者只知道「沒反應」。 */
const ADVANCE_MS=1400;   /* 完成後停留多久再自動前進；夠看清楚，又不至於等到不耐煩 */
const drill={pressed:{},bad:null,reps:0,miss:0,clean:0,banner:null,timer:null};

function drillReset(keepReps){
  if(drill.timer){clearTimeout(drill.timer);drill.timer=null}
  drill.pressed={};drill.bad=null;drill.banner=null;drill.miss=0;
  if(!keepReps){drill.reps=0;drill.clean=0}
  state.noteIndex=0}

function gotoBar(bar){
  const s=curSong();if(!s)return;
  demoStop();
  state.impBar=Math.max(1,Math.min(s.totalBars,bar));
  state.impPage=pageForBar(s.pages,state.impBar);
  drillReset();
  render._k=null;render()}

/* 螢幕上的琴鍵按下去，跟真的電鋼琴走同一條判定路徑。
   沒接琴的人也要能完整練完一個小節，否則這個程式對他毫無用處。 */
function pressKey(note){
  sound(note);
  judgeNote(midi(note))}

/* 判定一個按下去的音。收到的是 MIDI 音高數字。 */
function judgeNote(m){
  if(demo.on)return;                 /* 示範播放中不判定，免得被自己的示範打斷 */
  if(drill.banner)return;            /* 完成畫面停留期間忽略，避免手殘連按跳過兩節 */
  const st=curSteps();
  if(!st.length)return;
  const i=state.noteIndex%st.length;
  const want=st[i].keys.map(midi);
  const eq=function(a,b){return state.ignoreOctave?(a%12===b%12):a===b};
  const matched=want.filter(function(w){return eq(w,m)})[0];
  if(matched===undefined){
    /* 按錯：停在原地，並且明講按到了什麼。已按對的部分要清掉重來，
       否則和弦會變成「按錯也算數」。 */
    drill.bad=noteFromMidi(m);drill.pressed={};drill.miss++;
    state.miss=(state.miss||0)+1;
    render._k=null;render();return}
  drill.bad=null;
  drill.pressed[matched]=1;
  state.hit=(state.hit||0)+1;
  /* 和弦：要按的鍵全部到齊才算完成這一步。MIDI 的多個音不會同一毫秒抵達，
     用滑鼠更是一次只能點一個——所以是「集滿」而不是「同時」。 */
  if(want.every(function(w){return drill.pressed[w]}))stepDone(st);
  else{render._k=null;render()}}

function stepDone(st){
  drill.pressed={};
  state.noteIndex++;
  if(state.noteIndex>=st.length)barDone();
  else{render._k=null;render()}}

/* 一個小節走完了 */
function barDone(){
  midiLightsOff();
  state.noteIndex=0;
  drill.reps++;
  if(drill.miss===0)drill.clean++;else drill.clean=0;
  markAuto();
  const s=curSong();
  const target=Number(state.repTarget||1);   /* 0 = 一直重複，不自動前進 */
  const last=state.impBar>=s.totalBars;
  const enough=target>0&&drill.reps>=target;
  if(enough&&last){
    drill.banner={type:'end'};
  }else if(enough){
    drill.banner={type:'next'};
    drill.timer=setTimeout(function(){
      drill.banner=null;drill.timer=null;
      gotoBar(state.impBar+1)},ADVANCE_MS);
  }else{
    drill.banner={type:'again'};
    drill.timer=setTimeout(function(){
      drill.banner=null;drill.timer=null;drill.miss=0;
      render._k=null;render()},900);
  }
  render._k=null;render()}

/* 熟練度自動判定：完成一次＝練過了；連續兩次零失誤＝已熟。
   要使用者自己去按三顆「還沒練／練過了／已熟」按鈕，他不會按，
   進度條就永遠是空的。手動覆寫仍然留著。 */
function markAuto(){
  const s=curSong();if(!s||s.life)return;
  const cur=(state.progress[s.id]||{})[state.impBar]||0;
  const want=drill.clean>=2?2:1;
  if(want>cur)markBar(want)}

function markBar(lv){
  const s=curSong();if(!s||s.life)return;
  if(!state.progress[s.id])state.progress[s.id]={};
  state.progress[s.id][state.impBar]=lv;
  /* 同一首譜的幾個難度版本共用進度——練熟的是那個小節，不是那個版本 */
  const base=s.derivedFrom||s.id;
  IMPORTED_SONGS.forEach(function(o){
    if(o.id===base||o.derivedFrom===base){
      if(!state.progress[o.id])state.progress[o.id]={};
      state.progress[o.id][state.impBar]=lv}})}

function barLevel(bar){
  const s=curSong();if(!s)return 0;
  return (state.progress[s.id]||{})[bar]||0}

/* ---------- 示範這一節 ----------
   把「先整段亮起來讓手擺好，再照節奏走一遍」併進同一顆按鈕。
   以前這是獨立的「跟著燈練習」功能，但它是計時器驅動的——燈自己會走，
   不等你按。那跟「等你按對」是兩件事，混在一起只會讓人搞不清楚。
   現在它就是單純的示範：走一遍，走完把主導權交還給你。 */
const demo={timers:[],on:false,i:-1};
function demoStop(){
  demo.timers.forEach(function(t){clearTimeout(t)});
  demo.timers=[];demo.on=false;demo.i=-1;midiLightsOff()}

function demoRun(){
  if(demo.on){demoStop();render._k=null;render();return}
  const kind=curKind(),bar=curBar(),hand=state.hand;
  const st=practiceSteps(kind,bar,hand);
  if(!st.length)return;
  const sp=beatSpans(kind,bar,hand==='both'?'rh':hand);
  const gap=Math.max(220,60000/state.bpm/2);
  demoStop();demo.on=true;
  /* 第一階段：整節會用到的鍵一起亮，讓手先擺好位置 */
  const all=[];
  st.forEach(function(s){s.keys.forEach(function(n){if(n&&all.indexOf(n)<0)all.push(n)})});
  if(hand==='both')st.forEach(function(s){(s.lh||[]).forEach(function(n){if(n&&all.indexOf(n)<0)all.push(n)})});
  midiLight(all,0,1);
  /* 第二階段：依譜上的節奏依序走 */
  let t=Math.max(750,gap);
  st.forEach(function(s,i){
    const mult=sp[i]||1;
    demo.timers.push(setTimeout(function(){
      if(!demo.on)return;
      demo.i=i;
      const hold=Math.max(.25,gap/1000*mult*0.95);
      (s.rh||[]).forEach(function(n){sound(n,hold)});
      /* 左手只在真的換和弦那一拍按下去，但要一直響到下次換和弦為止。
         照右手的節奏每拍重敲、或用預設的 0.55 秒就斷掉，左手都會像沒按一樣。 */
      if(s.lhNew&&s.lh&&s.lh.length){
        let span=0;
        for(let k=i;k<st.length&&(k===i||!st[k].lhNew);k++)span+=(sp[k]||1);
        s.lh.forEach(function(n){sound(n,Math.max(.6,span*gap/1000*0.98))})}
      if(state.metro&&i===0)tick(true);
      midiLight(s.keys,0,1);
      render._k=null;render()},t));
    t+=gap*mult});
  demo.timers.push(setTimeout(function(){
    demo.on=false;demo.i=-1;render._k=null;render();lightNow()},t+320));
  render._k=null;render()}

/* ==================== 接上電鋼琴（Web MIDI）====================
   琴的 USB-C 孔可傳輸 MIDI，接上電腦後瀏覽器就讀得到你按了哪個鍵。
   兩個限制：只在 https 或 localhost 底下可用（file:// 拿不到權限）；Safari 不支援。 */
const midiIO={access:null,inputs:[],outs:[],status:'idle',error:'',recent:[]};

function midiSupported(){return typeof navigator!=='undefined'&&!!navigator.requestMIDIAccess}
function midiSecure(){return location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'}

function midiConnect(){
  if(!midiSupported()){midiIO.status='unsupported';render();return}
  if(!midiSecure()){midiIO.status='insecure';render();return}
  midiIO.status='connecting';render();
  /* 只設 connecting 然後等 promise，是不夠的：權限提示被晾在那裡不按、
     或環境根本不會回應時，畫面會永遠停在「連接中」，使用者無從判斷
     是慢還是壞了。逾時就退回可以再按一次的狀態。 */
  if(midiIO.connectTimer)clearTimeout(midiIO.connectTimer);
  midiIO.connectTimer=setTimeout(function(){
    if(midiIO.status==='connecting'){midiIO.status='idle';render()}},5000);
  navigator.requestMIDIAccess().then(function(access){
    if(midiIO.connectTimer){clearTimeout(midiIO.connectTimer);midiIO.connectTimer=null}
    midiIO.access=access;
    const bind=function(){
      midiIO.inputs=[];midiIO.outs=[];
      access.inputs.forEach(function(inp){
        midiIO.inputs.push(inp.name||'MIDI 裝置');
        inp.onmidimessage=onMidiMessage});
      /* MIDI 是雙向的。反方向（電腦→琴）可以讓琴用自己的音色發聲，
         有鍵盤燈的琴通常也會跟著把對應的鍵點亮。 */
      access.outputs.forEach(function(out){midiIO.outs.push(out)});
      midiIO.status=midiIO.inputs.length?'ready':'nodevice';
      /* 接上了就直接把點燈打開——使用者要的是「插上就能練」，不是再去翻設定 */
      if(midiIO.outs.length)state.lightKeys=true;
      render._k=null;render();lightNow()};
    bind();
    access.onstatechange=bind;
  }).catch(function(e){
    if(midiIO.connectTimer){clearTimeout(midiIO.connectTimer);midiIO.connectTimer=null}
    midiIO.status='denied';midiIO.error=String(e&&e.message||e);render()})}

function midiSend(bytes){
  if(!midiIO.outs||!midiIO.outs.length)return false;
  midiIO.outs.forEach(function(o){try{o.send(bytes)}catch(e){}});
  return true}

function midiLightsOff(){
  (midiIO.lit||[]).forEach(function(m){
    for(let ch=0;ch<16;ch++)midiSend([0x80|ch,m,0])});
  midiIO.lit=[]}

/* 點亮指定的鍵。ms 傳 0（或不傳）表示一直亮著不自動熄——
   練習時燈要留在那裡等你按，亮一下就滅的話根本來不及看。 */
function midiLight(notes,ms,vel){
  const v=vel===undefined?1:vel;   /* velocity 1：盡量只點燈、不發出大聲響 */
  const ns=(notes||[]).filter(Boolean).map(midi);
  if(!ns.length)return false;
  midiLightsOff();
  /* 有些琴會把收到的 Note On 原樣回送給電腦（MIDI thru）。若不擋掉，
     我們送出去點燈的那顆音會被當成「使用者按了鍵」，練習會自己往前跑。 */
  if(!midiIO.echo)midiIO.echo={};
  const now=Date.now();
  ns.forEach(function(m){midiIO.echo[m]=now});
  /* 掃過全部 16 個 channel：有些琴的燈只吃特定 channel，不一定是 1 */
  let ok=false;
  ns.forEach(function(n){
    for(let ch=0;ch<16;ch++) if(midiSend([0x90|ch,n,v])) ok=true});
  if(!ok)return false;
  midiIO.lit=ns.slice();
  if(ms>0) setTimeout(function(){midiLightsOff()},ms);
  return true}

/* 讓琴用自己的音色彈這一顆音，取代瀏覽器的合成音 */
function pianoOut(note,dur){return midiLight([note],Math.max(200,(dur||0.6)*1000),96)}
function sound(note,dur){
  if(state.useKeyboardSound&&midiIO.outs&&midiIO.outs.length){
    if(pianoOut(note,dur))return}
  playPiano(note,dur)}

/* 目前該按的鍵，在琴上點亮 */
function lightNow(){
  if(!state.lightKeys)return;
  if(demo.on||drill.banner)return;
  const st=curSteps();
  if(!st.length)return;
  const cur=st[state.noteIndex%st.length];
  if(cur&&cur.keys.length)midiLight(cur.keys,0,1)}   /* 0 = 一直亮著等你按 */

function onMidiMessage(ev){
  const d=ev.data;if(!d||d.length<3)return;
  const cmd=d[0]&0xf0, note=d[1], vel=d[2];
  if(cmd===0x90&&vel>0)midiNoteOn(note,vel)}

function midiNoteOn(n,vel){
  /* 擋掉自己送出去點燈的回授。
     判別關鍵是**力度**不是時間：點燈送的是 velocity 1，回授回來也是 1，
     而真人按鍵通常在 40 以上。用時間窗判斷會把「看到燈亮就立刻按下去」
     的正常操作也擋掉——那正是使用者最該被接受的動作。 */
  if(vel!==undefined&&vel<=2&&midiIO.echo&&midiIO.echo[n]&&Date.now()-midiIO.echo[n]<600){
    delete midiIO.echo[n];return}
  /* 留最近幾顆給畫面顯示，方便判斷是琴沒送訊號還是真的按錯 */
  midiIO.recent.push(noteFromMidi(n));
  if(midiIO.recent.length>8)midiIO.recent.shift();
  judgeNote(n)}

/* ==================== 畫面 ====================
   垂直順序就是使用順序，而且只有一層：
     頂列（選曲／接琴）→ 練習主卡 → 頁籤（目錄／曲譜／自動彈奏／設定）
   以前那個左側抽屜整個拿掉了。抽屜的正當用途是「當下不需要、但偶爾要調」的東西，
   而曲目、接琴、手位提示沒有一項符合——它們不是被收納，是被藏起來。 */

/* 頂列在 #app 之外，不隨每次判定重繪，只更新兩個地方 */
function syncTop(song){
  const sel=document.getElementById('songSelect');
  if(sel&&sel.value!==state.song)sel.value=state.song;
  const btn=document.getElementById('connBtn');
  if(btn){
    const ok=midiIO.status==='ready';
    btn.className='conn-btn'+(ok?' on':'');
    btn.innerHTML=ok
      ? '● 已接琴<em>　'+(midiIO.inputs[0]||'')+'</em>'
      : (midiIO.status==='connecting'?'…連接中':'○ 接上電鋼琴')}}

function songOptions(){
  const list=orderedSongs().map(function(s){
    const full=impSong(s.id);if(!full)return null;
    return {value:'imp:'+s.id, title:full.title, bars:full.totalBars,
      tag:full.melodyOnly?'只用白鍵 · 旋律單音 · 最好上手'
         :full.whiteOnly?'只用白鍵 · 旋律含八度雙音'
         :full.key+' · 含黑鍵'};
  }).filter(Boolean);
  list.push({value:'lifelong', title:'一生所愛', bars:114, tag:'1＝G'});
  return list}

function buildSongSelect(){
  const sel=document.getElementById('songSelect');
  if(!sel)return;
  sel.innerHTML=songOptions().map(function(o,i){
    /* 曲名本身常常已經寫著「（只用白鍵）」「（入門）」，再附一次難度標籤
       會變成同一件事講兩遍，反而看不出哪一版是哪一版 */
    const said=o.title.indexOf('白鍵')>=0||o.title.indexOf('入門')>=0;
    return '<option value="'+o.value+'">'+String(i+1).padStart(2,'0')+'　'+o.title
      +'　·　'+(said?'':o.tag+'　·　')+o.bars+' 小節</option>'}).join('');
  sel.value=state.song}

/* ---------- 練習主卡 ---------- */
function stageView(song){
  const kind=curKind(),bar=curBar();
  const st=curSteps();
  const idx=st.length?state.noteIndex%st.length:0;
  const inbar=state.hand==='both'
    ? barNotes(kind,bar,'rh').concat(barNotes(kind,bar,'lh'))
    : barNotes(kind,bar,state.hand);
  const cur=st[idx];
  const okNotes=cur?cur.keys.filter(function(n){return drill.pressed[midi(n)]}):[];
  return '<section class="stage">'
    +'<div class="stage-head">'
      +'<div class="bar-nav">'
      +'<button data-action="bar" data-bar="'+(bar-1)+'"'+(bar===1?' disabled':'')+' aria-label="上一小節">‹</button>'
      +'<div class="bar-now"><b>第 '+bar+' 小節</b><small>全曲 '+song.totalBars+' 小節　·　'
      +versionTag(song)+'</small></div>'
      +'<button data-action="bar" data-bar="'+(bar+1)+'"'+(bar>=song.totalBars?' disabled':'')+' aria-label="下一小節">›</button>'
      +'</div><div class="grow"></div>'
      +(song.life?'':handSeg())
    +'</div>'
    +'<div class="stage-body">'
      +(song.life?whiteToggle(kind):'')
      +bannerView(song)
      +meterView(st)
      +stepsView(kind,bar,st)
      +targetView(song,st,idx)
      +keyboard({active:(cur&&!drill.banner)?cur.keys:[],inbar:inbar,
                 ok:okNotes,bad:drill.bad?[drill.bad]:[]})
      +hintView(kind,bar,st)
    +'</div>'
    +footView(song,bar)
    +'</section>'}

function versionTag(song){
  if(song.life)return '簡譜級數';
  return song.melodyOnly?'入門版 · 白鍵單音'
       :song.whiteOnly?'純白鍵版'
       :song.key+' · 含黑鍵'}

function handSeg(){
  const b=function(h,t,s){return '<button class="'+(state.hand===h?'on':'')
    +'" data-action="hand" data-hand="'+h+'"><small>'+s+'</small>'+t+'</button>'};
  return '<div class="hand-seg">'
    +b('rh','右手','① 先練這隻')+b('lh','左手','② 再單獨練')+b('both','雙手','③ 最後合起來')
    +'</div>'}

/* 只彈白鍵的開關（只有內建那首用得到）。要說清楚代價：整首移調了 */
function whiteToggle(kind){
  const sh=state.white?whiteShift(kind):0;
  return '<div class="white-toggle'+(state.white?' on':'')+'">'
    +'<b>'+(state.white?'只彈白鍵（新手模式）':'原調')+'</b>'
    +'<small>'+(state.white
      ? '已整首移調 '+(sh>0?'+':'')+sh+' 個半音，幾乎所有音都落在白鍵。旋律和原曲一樣，只是整體'+(sh<0?'低':'高')+'了一點點。'
      : '黑鍵太多不好上手時，可以整首移調成幾乎全白鍵——同一首歌，只是換個高低。')
    +'</small><button data-action="white">'
    +(state.white?'切回原調':'切換成只彈白鍵')+'</button></div>'}

/* ---------- 完成橫幅：以前完全沒有這個東西 ----------
   「我按完了整個小節」如果沒有任何回饋，使用者不會知道自己完成了一件事，
   也就不會有繼續下去的理由。 */
function bannerView(song){
  const b=drill.banner;
  if(!b)return '';
  const bar=curBar();
  if(b.type==='end')
    return '<div class="done-banner end"><b>🎉 整首走完了</b>'
      +'<p>第 '+bar+' 小節是最後一節。要再練一次可以回到第 1 小節，'
      +'或到下面的「自動彈奏」整首聽一遍，聽聽看跟你彈的一不一樣。</p>'
      +'<div class="banner-btns"><button class="main" data-action="bar" data-bar="1">回到第 1 小節</button>'
      +'<button data-action="stay">再練這一節</button></div></div>';
  if(b.type==='again'){
    const target=Number(state.repTarget||1);
    return '<div class="done-banner"><b>✓ 第 '+bar+' 小節　完成第 '+drill.reps+' 次</b>'
      +'<p>'+(target>0?'再練 '+(target-drill.reps)+' 次就前進到下一節。'
                     :'設定是「一直重複」，不會自動前進。')+'</p></div>'}
  return '<div class="done-banner"><b>✓ 第 '+bar+' 小節　完成</b>'
    +'<p>'+(drill.miss===0?'零失誤。':'中間錯了 '+drill.miss+' 次。')
    +'　正在前進到第 '+(bar+1)+' 小節…</p>'
    +'<div class="banner-btns"><button data-action="stay">留在這一節再練</button>'
    +'<button class="main" data-action="now">立刻前進</button></div>'
    +'<i class="cd"></i></div>'}

/* 這一節走到第幾步——一眼看得到「還有多遠」 */
function meterView(st){
  if(!st.length)return '';
  const done=drill.banner?st.length:state.noteIndex;
  const target=Number(state.repTarget||1);
  return '<div class="meter"><b>這一節 '+st.length+' 步</b>'
    +'<div class="meter-track"><i style="width:'+(done/st.length*100)+'%"></i></div>'
    +'<span class="rep">已完成 '+done+'／'+st.length
    +(drill.reps?'　·　本節已練 '+drill.reps+(target>0?'／'+target:'')+' 次':'')+'</span></div>'}

/* ---------- 步驟格 ----------
   一個小節切成幾步、你走到哪一步、哪幾步已經過了——這就是「以小節為單位」
   在畫面上的樣子。以前只有一顆高亮的格子，看不出自己在整節裡的位置。 */
function stepsView(kind,bar,st){
  if(!st.length)return '';
  const done=drill.banner?st.length:state.noteIndex;
  const sp=beatSpans(kind,bar,state.hand==='both'?'rh':state.hand);
  const cls=function(i){
    if(demo.on)return i===demo.i?' demo':'';
    if(i<done)return ' done';
    if(i===done)return drill.bad?' now bad':' now';
    return ''};
  const dur=function(i){
    if(!sp[i])return '';
    return '<span class="dur" style="width:'+Math.min(100,beatLabel(sp[i]).w*22)
      +'%" title="'+beatLabel(sp[i]).name+'"></span>'};
  const nums=function(ch,hold){
    if(!ch||!ch.length)return '<span class="n hold">—</span>';
    return '<span class="n'+(hold?' hold':'')+'">'
      +ch.map(numberLabel).join('<i>+</i>')+'</span>'};
  if(state.hand!=='both')
    return '<div class="steps">'+st.map(function(s,i){
      return '<button class="step'+cls(i)+'" data-action="step" data-index="'+i+'">'
        +nums(s.keys)+'<span class="step-idx">第 '+(i+1)+' 步</span>'+dur(i)+'</button>'}).join('')
      +'</div>';
  /* 雙手：兩手排在同一條時間軸上，直向對齊就看得出誰跟誰同時。
     左手淡色＝繼續壓著、不要重按——這是實際被問過的問題。 */
  const row=function(label,pick,holdOf){
    return '<div class="strow"><span class="strow-label">'+label+'</span>'
      +st.map(function(s,i){
        return '<button class="step'+cls(i)+'" data-action="step" data-index="'+i+'">'
          +nums(pick(s),holdOf(s))+dur(i)+'</button>'}).join('')+'</div>'};
  return '<div class="steps two">'
    +row('右手',function(s){return s.rh},function(){return false})
    +row('左手',function(s){return s.lh},function(s){return !s.lhNew})
    +'</div>'}

/* ---------- 現在要按哪個鍵 ---------- */
function targetView(song,st,idx){
  if(!st.length){
    const other=state.hand==='rh'?'左手':'右手';
    return '<div class="target rest"><div class="target-say">'
      +'<b>這一小節'+(state.hand==='both'?'兩手都':state.hand==='rh'?'右手':'左手')+'沒有音</b>'
      +'<small>換到'+other+'，或直接跳到下一小節。</small></div></div>'}
  const cur=st[idx];
  const keys=cur.keys;
  const got=keys.filter(function(n){return drill.pressed[midi(n)]}).length;
  const blk=keys.length===1&&isBlack(keys[0]);
  if(drill.bad)
    return '<div class="target wrong">'
      +'<div class="target-key'+(keys.length>1?' multi':'')+(blk?' blk':'')+'">'
      +'<b>'+keys.map(numberLabel).join('<i>+</i>')+'</b><small>要按這個</small></div>'
      +'<div class="target-say"><b>你按的是 '+keyLabel(drill.bad)+'</b>'
      +'<small>要按的是 '+keys.map(keyLabel).join('　和　')+'　·　再試一次就好，不會扣分。</small>'
      +'</div></div>';
  return '<div class="target">'
    +'<div class="target-key'+(keys.length>1?' multi':'')+(blk?' blk':'')+'">'
    +'<b>'+keys.map(numberLabel).join('<i>+</i>')+'</b>'
    +'<small>'+(blk?'黑鍵':'白鍵')+'</small></div>'
    +'<div class="target-say">'
    +'<b>請'+(keys.length>1?'同時按　':'按 ')+keys.map(keyLabel).join('　和　')+'</b>'
    +'<small>第 '+(idx+1)+' ／ '+st.length+' 步'
    +(keys.length>1?'　·　已按下 '+got+'／'+keys.length+' 個鍵':'')
    +'　·　音名 '+keys.join(' + ')
    +(state.hand==='both'&&cur.lh&&cur.lh.length&&!cur.lhNew
      ? '　·　左手 '+cur.lh.map(numberLabel).join('+')+' 繼續壓著，不用重按':'')
    +'</small></div></div>'}

/* ---------- 手位與節奏：兩行字，不值得做成收合區塊 ----------
   手張開一次大約只能舒服覆蓋五個白鍵（五指位置）。右手拇指在最低音那端、
   左手拇指在最高音那端，所以兩手的「拇指該放哪」是相反方向算的。 */
function handPosition(notes,hand){
  const ws=notes.filter(Boolean).map(whiteNumber);
  if(!ws.length)return null;
  const lo=Math.min.apply(null,ws), hi=Math.max.apply(null,ws);
  return {lo:lo,hi:hi,span:hi-lo+1,thumb:hand==='lh'?hi:lo,oneShape:(hi-lo+1)<=5}}

function hintView(kind,bar,st){
  const hand=state.hand==='both'?'rh':state.hand;
  const notes=barNotes(kind,bar,hand);
  const p=handPosition(notes,hand);
  if(!p)return '';
  const name=hand==='lh'?'左手':'右手';
  const dir=hand==='lh'?'往左（低音方向）':'往右（高音方向）';
  const rhythm=st.length&&beatSpans(kind,bar,hand).length
    ? '　格子下方的橫條是<b>這個音要按多久</b>——長條要按住，短條快放。' : '';
  return '<p class="hint'+(p.oneShape?' ok':'')+'">'
    +'<b>'+name+'拇指放白鍵 '+p.thumb+' 號。</b>'
    +(p.oneShape
      ? '其餘手指'+dir+'依序擺好，這一節跨 '+p.span+' 個白鍵（'+p.lo+'–'+p.hi+'），手不用移動就彈得完。'
      : '這一節跨 '+p.span+' 個白鍵（'+p.lo+'–'+p.hi+'），超過一個手位，中途要移動手或用拇指穿過。')
    +rhythm+'</p>'}

/* ---------- 練習條：反覆＋速度＋熟練度合成一條 ----------
   這三件事回答的是同一個問題：「這一節我要怎麼練」。
   拆成三個面板只是把一件事切成三份，讓人得找三個地方。 */
function footView(song,bar){
  const target=Number(state.repTarget||1);
  const lv=barLevel(bar);
  const seg=function(action,opts,now){
    return '<div class="seg">'+opts.map(function(o){
      return '<button class="'+(o[0]===now?'on ':'')+(o[2]||'')+'" data-action="'+action
        +'" data-v="'+o[0]+'">'+o[1]+'</button>'}).join('')+'</div>'};
  return '<div class="stage-foot">'
    +'<button class="demo-btn'+(demo.on?' on':'')+'" data-action="demo">'
    +(demo.on?'■ 停止示範':'▶ 示範這一節')+'</button>'
    +'<div class="foot-item"><label>完成後</label>'
    +seg('rep',[[1,'前進'],[2,'練 2 次'],[3,'練 3 次'],[0,'一直重複']],target)+'</div>'
    +'<div class="foot-item"><label>示範速度</label>'
    +'<input data-action="tempo" type="range" min="24" max="80" value="'+state.bpm+'">'
    +'<b style="font-size:13px">♩='+state.bpm+'</b>'
    +'<button class="ghost'+(state.metro?' on':'')+'" data-action="metro" '
    +'title="只在示範與自動彈奏時會響">節拍器</button></div>'
    +(song.life?'':'<div class="foot-item"><label>熟練度</label>'
      +seg('mark',[[0,'還沒練'],[1,'練過了'],[2,'已熟','lv2']],lv)+'</div>')
    +'</div>'}

/* ==================== 頁籤 ====================
   目錄／曲譜／播放器／設定都是「兩次嘗試之間才會看」的參考資料，
   所以放在主卡**下方**。放上方會把「現在要按什麼」推出畫面，
   而那是唯一一個手在琴上時還需要看的東西。 */
const TABS=[
  ['catalog','小節目錄','整首一次看完，點格子跳過去'],
  ['score','曲譜','原譜掃描圖'],
  ['auto','自動彈奏','先整首聽一遍'],
  ['midi','接琴與設定','電鋼琴、正確率、點燈']];

function tabsView(song){
  const t=state.tab||'catalog';
  const pane=t==='score'?scoreView(song)
            :t==='auto'?'<div class="pane-pad">'+autoPanel(song,curBar())+'</div>'
            :t==='midi'?'<div class="pane-pad">'+midiPanel()+'</div>'
            :catalogView(song);
  return '<nav class="tabs">'+TABS.map(function(x){
      return '<button class="'+(x[0]===t?'on':'')+'" data-action="tab" data-v="'+x[0]+'">'
        +x[1]+'<small>'+x[2]+'</small></button>'}).join('')+'</nav>'
    +'<div class="tabpane">'+pane+'</div>'}

/* ---------- 小節目錄 ---------- */
function catalogView(song){
  const kind=curKind(),bar=curBar(),total=song.totalBars;
  const keyMode=true;
  /* 資料只有 rh / lh 兩欄。雙手模式下若直接拿 state.hand 去查會得到空陣列，
     整個目錄會變成一整片「休」——目錄空間有限，這裡固定顯示右手旋律。 */
  const catHand=state.hand==='both'?'rh':state.hand;
  const p=state.progress[song.id]||{};
  const done=Object.keys(p).filter(function(k){return p[k]===2}).length;
  const learning=Object.keys(p).filter(function(k){return p[k]===1}).length;
  return '<div class="cat-head"><b>全曲 '+total+' 個小節</b>'
    +'<span>已熟 '+done+'　·　練過 '+learning+'　·　目前在第 '+bar+' 小節</span></div>'
    +'<div class="cat-legend"><span><i style="background:#fff"></i>還沒練</span>'
    +'<span><i style="background:#fbfde8"></i>練過了</span>'
    +'<span><i style="background:#eaf3d8"></i>已熟</span>'
    +'<span><i style="background:#ff6647"></i>現在這一節</span>'
    +'<span>格子裡就是要按的琴鍵編號，白底＝白鍵、黑底＝夾住它的兩個白鍵</span></div>'
    +song.pages.map(function(pg,pi){
      let buttons='';
      for(let n=pg.start;n<=pg.end;n++){
        const lv=p[n]||0;
        buttons+='<button class="'+(n===bar?'selected ':'')+(lv===2?'lv2':lv===1?'lv1':'')
          +'" data-action="measure" data-bar="'+n+'">'
          +'<small class="kc-bar">第 '+n+' 小節'+(song.pages.length>1?' · P'+(pi+1):'')
          +(state.hand==='both'?' · 右手':'')+'</small>'
          +chipRow(barChords(kind,n,catHand))+'</button>'}
      /* 曲譜頁的 title 常常本來就叫「第 N 頁」，再印一次頁碼會變成
         「第 1 頁／第 1 頁」。只有 title 帶了額外資訊時才多印一行。 */
      const auto='第 '+(pi+1)+' 頁';
      return '<article class="page-block"><div class="page-label">'
        +'<div><b>'+auto+'</b>'+(pg.title&&pg.title!==auto?'<small>'+pg.title+'</small>':'')+'</div>'
        +'<span>小節 '+pg.start+'–'+pg.end+'</span></div>'
        +'<div class="measure-grid '+(keyMode?'keys':'')+'">'+buttons+'</div></article>'}).join('')}

/* 一顆琴鍵一個小方塊。白鍵直接印編號；黑鍵在實體琴上沒有印數字，
   所以標「夾住它的那兩個白鍵」，並用黑底對應手指要找的黑色鍵。 */
function keyChip(note){return isBlack(note)
  ? '<i class="kc blk">'+whiteNumber(note)+'–'+(whiteNumber(note)+1)+'</i>'
  : '<i class="kc">'+whiteNumber(note)+'</i>'}
/* 一個時間點一組。同時要按的鍵用 kc-stack 併在一起，
   才看得出「這兩個是一起按」而不是「先後按」。 */
function chipRow(chords){
  if(!chords.length)return '<div class="kc-row"><i class="kc rest">休</i></div>';
  return '<div class="kc-row">'+chords.map(function(ch){
    return ch.length>1
      ? '<span class="kc-stack">'+ch.map(keyChip).join('')+'</span>'
      : keyChip(ch[0])}).join('')+'</div>'}

/* ---------- 曲譜 ---------- */
function scoreView(song){
  const pages=song.pages;
  const page=Math.max(0,Math.min(pages.length-1,state.impPage));
  const p=pages[page];
  return (pages.length>1?'<div class="page-tabs">'+pages.map(function(x,i){
      return '<button class="'+(i===page?'on':'')+'" data-action="page" data-v="'+i+'">'
        +'<small>第 '+(i+1)+' 頁 · '+x.start+'–'+x.end+'</small><b>'+x.title+'</b></button>'}).join('')
    +'</div>':'')
    +(p.src
      ? '<div class="score-image '+(state.zoom?'zoom':'')+'"><img src="'+p.src+'" alt="曲譜第 '+(page+1)+' 頁"></div>'
      /* 線上版不附曲譜掃描圖（樂譜有版權），琴鍵數字與跟彈功能完全一樣 */

    +(p.src?'<div class="score-controls">'
      +'<button data-action="page" data-v="'+(page-1)+'"'+(page===0?' disabled':'')+'>← 上一頁</button>'
      +'<button class="main" data-action="zoom">'+(state.zoom?'縮小曲譜':'放大曲譜')+'</button>'
      +'<button data-action="page" data-v="'+(page+1)+'"'+(page===pages.length-1?' disabled':'')+'>下一頁 →</button>'

    +'程式就能知道你按了哪個鍵——<b>按對自動前進，按錯當場告訴你</b>。</p>'
    +'<p class="midi-tip">要用<b>能傳資料</b>的 USB-C 線（只能充電的線接了也認不到）、'

    +'<p class="midi-tip">沒有接琴也能練——直接用滑鼠點畫面上的鍵盤，判定完全一樣。</p>'
    +'<button class="main" data-action="midi-connect">連接電鋼琴</button>')}

/* ==================== 自動彈奏播放器 ====================
   把整首（或指定範圍）從頭播到尾，先聽過一遍再自己彈。

   ---------- 為什麼是「分批排程」而不是一次排完 ----------
   Web MIDI 的 output.send(data, timestamp) 可以把事件排到未來的某個時刻，
   節奏會非常準。很容易想到的做法是開播時就把整首曲子（近兩千個事件）
   一次送進輸出埠——聽起來確實準，但「停不下來」：

   - 規格裡的 output.clear() 在 Chrome 沒有實作，呼叫回傳 undefined、實際無效。
   - 送 All Notes Off 只能讓「當下已經響著的音」閉嘴，排在後面的 Note On
     時間一到還是會照樣冒出來，於是按了停止之後音符繼續一顆一顆跑。
   - 唯一真的斷得乾淨的手段是 output.close() 關掉整個埠，但那會讓裝置從
     midiIO.outs 消失，得重新 requestMIDIAccess 才能再用。代價太大。

   所以這裡改成：事件表一次算好（那只是資料，很便宜），但每次只把
   「未來 AUTO_LOOKAHEAD 毫秒內」的事件真的送出去，用 setInterval 續推。 */
const AUTO_TICK=200;        /* 排程器每 200ms 醒來一次 */
const AUTO_LOOKAHEAD=1200;  /* 每次只排未來 1.2 秒的事件；也就是停止的最壞延遲 */
const autoPlay={on:false,paused:false,pausedAt:0,timer:null,mop:null,
  events:[],cursor:0,t0:0,total:0,from:1,to:1,barSec:2,useMidi:false,
  lastBar:0,synthTimers:[]};

if(state.autoFrom===undefined)state.autoFrom=0;   /* 0 代表「整首」 */
if(state.autoTo===undefined)state.autoTo=0;
if(state.autoRh===undefined)state.autoRh=true;
if(state.autoLh===undefined)state.autoLh=true;
if(state.autoSrc===undefined)state.autoSrc='midi';
if(state.autoBeats===undefined)state.autoBeats=4;
if(state.autoFollow===undefined)state.autoFollow=false;

function autoHasOut(){return !!(midiIO.outs&&midiIO.outs.length)}
function autoUseMidi(){return autoHasOut()&&state.autoSrc!=='synth'}
function autoRange(song){
  let a=Number(state.autoFrom)||1;
  let b=Number(state.autoTo)||song.totalBars;
  a=Math.max(1,Math.min(song.totalBars,a));
  b=Math.max(a,Math.min(song.totalBars,b));
  return [a,b]}
function autoBarSec(){
  const beats=Number(state.autoBeats)||4;
  return beats*60/Math.max(20,Number(state.bpm)||36)}
function autoMMSS(sec){const s=Math.round(sec);
  return s>=60?Math.floor(s/60)+' 分 '+(s%60)+' 秒':s+' 秒'}

/* 每個和弦的起點用譜上量到的相對位置 rt/lt（0~1）換算成小節內的秒數，
   所以節奏跟原譜的比例間距一致，不是等間隔的機器人節奏。
   時值一律算到「同一隻手的下一個和弦」為止，最後一個算到小節結尾。 */
function autoBuildEvents(kind,from,to,barSec,opts){
  const hands=[];
  if(opts.rh)hands.push('rh');
  if(opts.lh)hands.push('lh');
  const events=[];
  for(let bar=from;bar<=to;bar++){
    const base=(bar-from)*barSec;
    hands.forEach(function(hand){
      /* 一律走 barChords：移調（純白鍵版）與單音簡化（入門版）都在它裡面。
         直接讀 song.bars 會播出沒有簡化過的原始音符。 */
      const chords=barChords(kind,bar,hand);
      if(!chords.length)return;
      const s=impSong(kind.slice(4));
      const times=s?impTimes(s,bar,hand):[];
      chords.forEach(function(ch,i){
        const rel=times[i]!==undefined?times[i]:i/chords.length;
        const nextRel=(i+1<chords.length)
          ? (times[i+1]!==undefined?times[i+1]:(i+1)/chords.length)
          : 1;
        const on=base+rel*barSec;
        const dur=Math.max(0.08,(nextRel-rel)*barSec*0.98);
        ch.forEach(function(n){
          if(!n)return;
          events.push({t:on*1000,type:'on',note:n,hand:hand,bar:bar,dur:dur});
          events.push({t:(on+dur)*1000,type:'off',note:n,hand:hand,bar:bar})})})})}
  /* 同一時刻先放掉舊音再按新音，重複同一顆音才不會被自己的 Note Off 掐掉 */
  events.sort(function(a,b){return (a.t-b.t)||(a.type===b.type?0:a.type==='off'?-1:1)});
  return events}

function autoSendAt(bytes,when){
  if(!autoHasOut())return;
  midiIO.outs.forEach(function(o){try{o.send(bytes,when)}catch(e){}})}

/* 停止時的完整靜音序列。少了任何一條都可能有音卡住一直響 */
function autoPanic(){
  if(!autoHasOut())return false;
  midiIO.outs.forEach(function(o){
    for(let ch=0;ch<16;ch++){
      try{
        o.send([0xB0|ch,120,0]);   /* All Sound Off */
        o.send([0xB0|ch,123,0]);   /* All Notes Off */
        o.send([0xB0|ch,64,0]);    /* 放開延音踏板，否則放開的音還會被踏板留住 */
      }catch(e){}}});
  return true}

function autoPump(){
  if(!autoPlay.on)return;
  const now=performance.now();
  const horizon=now-autoPlay.t0+AUTO_LOOKAHEAD;
  const evs=autoPlay.events;
  while(autoPlay.cursor<evs.length&&evs[autoPlay.cursor].t<=horizon){
    const ev=evs[autoPlay.cursor++];
    const when=autoPlay.t0+ev.t;
    if(autoPlay.useMidi){
      autoSendAt(ev.type==='on'?[0x90,midi(ev.note),96]:[0x80,midi(ev.note),0],when);
    }else if(ev.type==='on'){
      /* 合成音沒有 Note Off，時值直接交給 playPiano 的音量包絡 */
      autoPlay.synthTimers.push(setTimeout(function(){
        if(autoPlay.on)playPiano(ev.note,ev.dur)},Math.max(0,when-now)))}}
  if(autoPlay.synthTimers.length>600)autoPlay.synthTimers=autoPlay.synthTimers.slice(-200);
  autoStatus(now);
  if(autoPlay.cursor>=evs.length&&now-autoPlay.t0>autoPlay.total+300)autoStop();}

/* 進度顯示。絕對不要在這裡呼叫 render()——它會重建整頁 DOM，
   畫面會閃爍、捲動位置也會跳掉。只改幾個小元素的文字與 class。 */
function autoStatus(now){
  const t=(now===undefined?performance.now():now)-autoPlay.t0;
  const span=autoPlay.barSec*1000;
  const count=autoPlay.to-autoPlay.from+1;
  let idx=Math.floor(Math.max(0,t)/span);
  if(idx>count-1)idx=count-1;
  const bar=autoPlay.from+idx;
  const beats=Number(state.autoBeats)||4;
  let beat=Math.floor((Math.max(0,t)-idx*span)/span*beats)+1;
  if(beat<1)beat=1;
  if(beat>beats)beat=beats;
  const el=document.getElementById('autoStatus');
  if(el)el.innerHTML=(t<0?'<b>準備中…</b>':'<b>第 '+bar+' 小節</b>　第 '+beat+' ／ '+beats+' 拍')
    +'<small>播放範圍 '+autoPlay.from+'–'+autoPlay.to+' 小節　·　'
    +(autoPlay.useMidi?'琴的音色（MIDI）':'瀏覽器合成音')+'　·　'
    +(state.autoRh&&state.autoLh?'雙手':state.autoRh?'只有右手':'只有左手')+'</small>';
  const tr=document.getElementById('autoTrack');
  if(tr)tr.style.width=Math.max(0,Math.min(100,t/Math.max(1,autoPlay.total)*100))+'%';
  if(bar!==autoPlay.lastBar){
    autoPlay.lastBar=bar;
    document.querySelectorAll('.measure-grid button.playing').forEach(function(b){b.classList.remove('playing')});
    const cell=document.querySelector('.measure-grid button[data-action="measure"][data-bar="'+bar+'"]');
    if(cell){
      cell.classList.add('playing');
      /* 預設不捲動：彈琴時兩手都在琴上，畫面自己動反而找不到位置 */
      if(state.autoFollow)cell.scrollIntoView({block:'nearest'})}}}

function autoHalt(){
  autoPlay.on=false;
  if(autoPlay.timer){clearInterval(autoPlay.timer);autoPlay.timer=null}
  autoPlay.synthTimers.forEach(function(id){clearTimeout(id)});
  autoPlay.synthTimers=[];
  autoPanic();
  /* 已經進了驅動程式佇列的訊息取消不掉（Chrome 沒有 output.clear()），
     等 lookahead 過完再補一次靜音，把窗內漏出來的音收乾淨。 */
  if(autoPlay.mop)clearTimeout(autoPlay.mop);
  autoPlay.mop=setTimeout(function(){if(!autoPlay.on)autoPanic()},AUTO_LOOKAHEAD+200)}

function autoStop(redraw){
  const was=autoPlay.on||autoPlay.paused;
  autoHalt();
  autoPlay.paused=false;autoPlay.pausedAt=0;
  autoPlay.events=[];autoPlay.cursor=0;autoPlay.lastBar=0;
  document.querySelectorAll('.measure-grid button.playing').forEach(function(b){b.classList.remove('playing')});
  const tr=document.getElementById('autoTrack');if(tr)tr.style.width='0%';
  if(was&&redraw!==false)render()}

function autoPause(){
  if(!autoPlay.on)return;
  const at=performance.now()-autoPlay.t0;
  autoPlay.pausedAt=at;autoPlay.paused=true;
  autoHalt();
  /* 已排進 lookahead 但還沒響就被靜音的事件，指標倒回去，續播才不會缺一段 */
  while(autoPlay.cursor>0&&autoPlay.events[autoPlay.cursor-1].t>=at)autoPlay.cursor--;
  render()}

function autoResume(){
  if(!autoPlay.paused||!autoPlay.events.length)return;
  autoPlay.paused=false;autoPlay.on=true;
  render();
  autoPlay.t0=performance.now()-autoPlay.pausedAt+120;
  autoPump();
  autoPlay.timer=setInterval(autoPump,AUTO_TICK)}

function autoStart(){
  const song=curSong();
  if(!song)return;
  autoStop(false);
  if(!state.autoRh&&!state.autoLh)state.autoRh=true;
  const kind=curKind();
  const r=autoRange(song);
  const barSec=autoBarSec();
  autoPlay.from=r[0];autoPlay.to=r[1];autoPlay.barSec=barSec;
  autoPlay.events=autoBuildEvents(kind,r[0],r[1],barSec,{rh:state.autoRh,lh:state.autoLh});
  autoPlay.cursor=0;autoPlay.lastBar=0;
  autoPlay.total=(r[1]-r[0]+1)*barSec*1000;
  autoPlay.useMidi=autoUseMidi();
  autoPlay.on=true;
  render();                            /* 整頁重繪只在開始／停止各一次 */
  /* render() 之後才對時：重建整頁 DOM 要花時間，先對時的話第一顆音會被吃掉 */
  autoPlay.t0=performance.now()+260;
  autoPump();
  autoPlay.timer=setInterval(autoPump,AUTO_TICK)}

function autoTipHtml(song){
  const r=autoRange(song),sec=autoBarSec();
  return '目前速度 ♩ = '+state.bpm+'，一小節 '+(Number(state.autoBeats)||4)+' 拍 ≈ '+sec.toFixed(1)+' 秒。'
    +'這段共 '+(r[1]-r[0]+1)+' 小節、約 '+autoMMSS((r[1]-r[0]+1)*sec)+'。'
    +'播放中改速度不會立刻生效，要重新按開始。'
    +(autoHasOut()?'':'（目前偵測不到 MIDI 輸出埠，會用瀏覽器合成音發聲。）')}

function autoPanel(song,bar){
  const r=autoRange(song);
  const has=autoHasOut(),useMidi=autoUseMidi();
  const on=autoPlay.on,paused=autoPlay.paused;
  return '<div class="auto">'
    +'<div class="midi-head"><b>自動彈奏</b><span>先整首聽一遍，再照著數字彈</span></div>'
    +'<div class="auto-row"><label>從第</label>'
    +'<input data-action="auto-from" type="number" min="1" max="'+song.totalBars+'" value="'+r[0]+'">'
    +'<label>小節　播到第</label>'
    +'<input data-action="auto-to" type="number" min="1" max="'+song.totalBars+'" value="'+r[1]+'">'
    +'<label>小節</label></div>'
    +'<div class="auto-opts">'
    +'<button data-action="auto-all">整首（1–'+song.totalBars+'）</button>'
    +'<button data-action="auto-here">從現在這一節（第 '+bar+' 節）起</button></div>'
    +'<div class="auto-opts">'
    +'<button class="'+(state.autoRh?'on':'')+'" data-action="auto-rh">'+(state.autoRh?'✓ ':'')+'右手（旋律）</button>'
    +'<button class="'+(state.autoLh?'on':'')+'" data-action="auto-lh">'+(state.autoLh?'✓ ':'')+'左手（伴奏）</button></div>'
    +'<div class="auto-opts">'
    +'<button class="'+(useMidi?'on':'')+'" data-action="auto-src" data-src="midi"'+(has?'':' disabled')+'>'
    +(useMidi?'✓ ':'')+'用琴的音色（MIDI）</button>'
    +'<button class="'+(useMidi?'':'on')+'" data-action="auto-src" data-src="synth">'
    +(useMidi?'':'✓ ')+'瀏覽器合成音</button></div>'
    +'<div class="auto-opts">'
    +'<button class="'+(Number(state.autoBeats)===4?'on':'')+'" data-action="auto-beats" data-beats="4">一小節 4 拍</button>'
    +'<button class="'+(Number(state.autoBeats)===3?'on':'')+'" data-action="auto-beats" data-beats="3">一小節 3 拍</button>'
    +'<button class="'+(state.autoFollow?'on':'')+'" data-action="auto-follow">'+(state.autoFollow?'✓ ':'')+'畫面跟著跑</button></div>'
    +'<div class="auto-go">'
    +'<button class="main'+(on?' on':'')+'" data-action="auto-play">'
    +(on?'❚❚ 暫停':paused?'▶ 繼續播放':'▶ 開始自動彈奏')+'</button>'
    +'<button data-action="auto-stop"'+(on||paused?'':' disabled')+'>■ 停止</button></div>'
    +'<div class="auto-status" id="autoStatus">'
    +(on?'<b>準備中…</b>':paused?'<b>已暫停</b>':'尚未播放')+'</div>'
    +'<div class="auto-track"><i id="autoTrack" style="width:0%"></i></div>'
    +'<p class="auto-tip" id="autoTip">'+autoTipHtml(song)+'</p>'
    +'</div>'}

/* ==================== 事件 ==================== */
function render(){
  const song=curSong();
  if(!song){app.innerHTML='<div class="notice">找不到這首曲目</div>';return}
  syncTop(song);
  app.innerHTML=stageView(song)+tabsView(song);
  save();
  /* 換到不同的音才送點燈訊號。render 會因為各種原因重跑，
     每次都送的話琴會被訊息洗版。 */
  const k=state.song+'/'+state.impBar+'/'+state.noteIndex+'/'+state.hand+'/'+(drill.banner?'b':'');
  if(state.lightKeys&&k!==render._k){render._k=k;lightNow()}}

document.addEventListener('click',function(e){
  const b=e.target.closest&&e.target.closest('button');
  if(!b)return;
  const a=b.dataset.action;
  if(!a)return;
  const song=curSong();
  const v=b.dataset.v;

  /* --- 自動彈奏 --- */
  if(a.slice(0,5)==='auto-'){
    if(!song)return;
    if(a==='auto-play'){
      if(autoPlay.on)autoPause();
      else if(autoPlay.paused)autoResume();
      else autoStart();
      return}
    if(a==='auto-stop'){autoStop();return}
    if(a==='auto-all'){state.autoFrom=1;state.autoTo=song.totalBars}
    if(a==='auto-here'){state.autoFrom=curBar();
      if(!state.autoTo||state.autoTo<curBar())state.autoTo=song.totalBars}
    if(a==='auto-rh'){state.autoRh=!state.autoRh;if(!state.autoRh&&!state.autoLh)state.autoLh=true}
    if(a==='auto-lh'){state.autoLh=!state.autoLh;if(!state.autoRh&&!state.autoLh)state.autoRh=true}
    if(a==='auto-src')state.autoSrc=b.dataset.src;
    if(a==='auto-beats')state.autoBeats=Number(b.dataset.beats);
    if(a==='auto-follow')state.autoFollow=!state.autoFollow;
    save();render();return}

  /* --- 練琴 --- */
  if(a==='key'){pressKey(b.dataset.note);return}
  if(a==='bar'){gotoBar(Number(b.dataset.bar));return}
  if(a==='measure'){
    gotoBar(Number(b.dataset.bar));
    /* 從目錄跳過去以後，畫面要回到「現在要按什麼」，不然人還停在目錄裡 */
    window.scrollTo({top:0,behavior:'smooth'});return}
  if(a==='hand'){state.hand=b.dataset.hand;drillReset();render._k=null;render();return}
  if(a==='step'){
    /* 點某一步＝跳到那一步並試聽。要一次把同時要按的音都發出來，
       逐音播放會把八度雙音變成快速的八度跳躍，聽起來完全不像原曲。 */
    const st=curSteps();const i=Number(b.dataset.index);
    if(st[i]){
      state.noteIndex=i;drill.pressed={};drill.bad=null;
      (st[i].rh||[]).forEach(function(n){sound(n)});
      (st[i].lh||[]).forEach(function(n){sound(n,1.2)});
      if(!st[i].rh.length&&!st[i].lh.length)st[i].keys.forEach(function(n){sound(n)});
      render._k=null;render()}
    return}
  if(a==='demo'){demoRun();return}
  if(a==='stay'){
    if(drill.timer){clearTimeout(drill.timer);drill.timer=null}
    drill.banner=null;drill.reps=0;drill.miss=0;state.noteIndex=0;
    render._k=null;render();return}
  if(a==='now'){
    if(drill.timer){clearTimeout(drill.timer);drill.timer=null}
    drill.banner=null;gotoBar(state.impBar+1);return}
  if(a==='rep'){state.repTarget=Number(v);save();render();return}
  if(a==='mark'){markBar(Number(v));render();return}
  if(a==='metro'){state.metro=!state.metro;render();return}
  if(a==='white'){state.white=!state.white;drillReset();render._k=null;render();return}

  /* --- 頁籤與曲譜 --- */
  if(a==='tab'){state.tab=v;render();return}
  if(a==='page'){
    const i=Number(v);
    if(song&&i>=0&&i<song.pages.length){state.impPage=i;render()}
    return}
  if(a==='zoom'){state.zoom=!state.zoom;render();return}

  /* --- 接琴 --- */
  if(a==='conn'){
    if(midiIO.status==='ready'){state.tab='midi';render();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
    else midiConnect();
    return}
  if(a==='midi-connect'){midiConnect();return}
  if(a==='midi-oct'){state.ignoreOctave=!state.ignoreOctave;render();return}
  if(a==='midi-reset'){state.hit=0;state.miss=0;render();return}
  /* 清掉防抖記錄讓 render 重送一次即可，別自己再呼叫一遍——會送出重複訊息 */
  if(a==='midi-light'){state.lightKeys=!state.lightKeys;
    if(!state.lightKeys)midiLightsOff();
    render._k=null;render();return}
  if(a==='midi-sound'){state.useKeyboardSound=!state.useKeyboardSound;render();return}
  /* 掃過全部 16 個 MIDI channel。有些琴的鍵盤燈只吃特定 channel（不一定是 1），
     只送一個 channel 的話，燈明明能亮也會被誤判成不支援。
     velocity 1 幾乎不發聲，所以連送 16 次不會吵。 */
  if(a==='midi-test'){
    state.lightTested=true;
    const n=midi('C4');
    for(let ch=0;ch<16;ch++){
      (function(c){
        setTimeout(function(){
          midiSend([0x90|c,n,1]);
          setTimeout(function(){midiSend([0x80|c,n,0])},1200)},c*90)})(ch)}
    render();return}
});

/* 速度用 input 即時更新。自動彈奏的起訖小節刻意不 render——
   重繪會把輸入框整個換掉，數字才打一半就失去焦點 */
document.addEventListener('input',function(e){
  const t=e.target;
  if(!t||!t.dataset)return;
  const a=t.dataset.action;
  if(a==='tempo'){state.bpm=Number(t.value);render();return}
  if(a!=='auto-from'&&a!=='auto-to')return;
  const song=curSong();
  if(!song)return;
  const v=Math.max(1,Math.min(song.totalBars,Number(t.value)||1));
  if(a==='auto-from'){state.autoFrom=v;if(state.autoTo&&state.autoTo<v)state.autoTo=v}
  else{state.autoTo=v;if(state.autoFrom&&state.autoFrom>v)state.autoFrom=v}
  save();
  const tip=document.getElementById('autoTip');
  if(tip)tip.innerHTML=autoTipHtml(song)});

/* 換曲目要回到開頭。沿用上一首的小節數／頁碼在曲子長度不同時會指到不存在的地方 */
document.addEventListener('change',function(e){
  if(!e.target||e.target.id!=='songSelect')return;
  if(autoPlay.on||autoPlay.paused)autoStop(false);
  demoStop();
  state.song=e.target.value;
  state.impBar=1;state.impPage=0;
  if(state.song==='lifelong')state.hand='rh';
  drillReset();
  render._k=null;render()});

/* ==================== 啟動 ==================== */
buildSongSelect();
if(state.song==='lifelong')state.hand='rh';
drillReset();
render();
/* 在 localhost / https 底下自動試著接琴。使用者最不想做的事就是
   每次打開都先去按一次「連接電鋼琴」。 */
if(midiSupported()&&midiSecure())midiConnect();

</script>
</body>
</html>

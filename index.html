<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Piano Flow｜琴鍵數字練習</title>
<!--
  PIANO FLOW STANDALONE EXPORT
  這是一個無外部依賴的單檔 HTML。
  交給 Codex 修改時，可直接要求它搜尋：
  1. APP DATA：歌曲、頁碼、小節與音符資料
  2. DESIGN：所有畫面樣式
  3. APP LOGIC：所有互動功能
-->
<style>
/* ==================== DESIGN：從這裡修改外觀 ==================== */
:root{--ink:#171714;--paper:#f3f0e8;--acid:#d8ff47;--orange:#ff6647;--line:#c9c5ba;--muted:#706e67;--white:#fff}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"Noto Sans TC",sans-serif}.topbar{height:70px;position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,4vw);border-bottom:1px solid var(--line);background:rgba(243,240,232,.94);backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.brandmark{display:grid;place-items:center;width:34px;height:34px;border:2px solid;border-radius:50%;font-size:11px}.session:before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:var(--orange)}.session{font-size:12px}.shell{max-width:1180px;margin:auto;padding:60px 28px}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:end;margin-bottom:48px}.eyebrow{margin:0 0 14px;font-size:10px;font-weight:900;letter-spacing:.15em;text-transform:uppercase}.hero h1,.section-title h2,.catalog-head h2{margin:0;font:400 clamp(44px,7vw,88px)/.98 Georgia,"Noto Serif TC",serif;letter-spacing:-.045em}.hero h1 em,.section-title em,.catalog-head em{color:var(--orange);font-style:italic}.hero>p{margin:0;font-size:17px;line-height:1.7;color:#4d4b44}/* 曲目下拉選單。曲目變多以後一整排按鈕會佔掉半個畫面，改成選單 */
.song-picker{margin-bottom:42px;padding:16px 18px;border:1px solid var(--ink);background:var(--white)}
.song-picker label{display:block;margin-bottom:8px;color:var(--muted);font-size:12px;letter-spacing:.08em}
.song-picker select{width:100%;padding:13px 14px;border:1px solid var(--ink);border-radius:0;background:var(--paper);font:700 17px/1.3 inherit;color:var(--ink);cursor:pointer}
.song-note{margin:9px 0 0;color:var(--muted);font-size:13px}
.song-switch{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-bottom:42px;border:1px solid var(--ink)}.song-switch button{min-height:88px;padding:17px 20px;border:0;border-right:1px solid var(--ink);background:#fff;text-align:left;cursor:pointer}.song-switch button:last-child{border-right:0}.song-switch button.on{background:var(--acid)}.song-switch small,.song-switch b{display:block}.song-switch small{margin-bottom:8px;color:var(--muted)}.song-switch b{font-size:18px}.panel{margin:0 0 42px;border:2px solid var(--ink);background:#fff}.catalog-head{display:grid;grid-template-columns:1fr 190px;gap:30px;align-items:center;padding:30px;background:var(--ink);color:#fff}.catalog-head h2{font-size:clamp(34px,5vw,62px)}.catalog-head p:last-child{max-width:700px;color:#c9c9c3;line-height:1.65}.count{display:grid;place-items:center;padding:22px;border:2px solid var(--acid)}.count b{font:700 60px/1 Georgia;color:var(--acid)}.count span,.count small{font-size:11px}.count small{margin-top:8px;color:#aaa}.page-block{background:#eeeae1;border-top:1px solid #999}.page-block.active{background:#fff8dd}.page-label{display:flex;justify-content:space-between;padding:13px 18px}.page-label small,.page-label b{display:block}.page-label small{color:#777}.measure-grid{display:grid;grid-template-columns:repeat(10,1fr);background:#aaa;gap:1px}.measure-grid button{min-width:0;min-height:72px;padding:8px;border:0;background:#fff;text-align:left;cursor:pointer}
/* 琴鍵數字模式：格子直接列出這一小節要按的琴鍵編號，不必先看懂五線譜 */
.measure-grid.keys{grid-template-columns:repeat(4,1fr)}
.measure-grid.keys button{min-height:64px;padding:9px 10px}
.kc-row{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
/* color 一定要寫死。選中的格子會把文字改成白色，白底的白鍵編號就會整個消失 */
.kc{display:inline-flex;align-items:center;justify-content:center;min-width:25px;height:25px;padding:0 5px;border:1px solid var(--ink);border-radius:4px;background:var(--white);color:var(--ink);font:700 14px/1 inherit;font-style:normal}
/* 黑鍵在琴上沒有印數字，所以標「夾住它的兩個白鍵」，並用黑底對應實體黑鍵 */
.kc.blk{background:var(--ink);color:var(--white);font-size:11px;letter-spacing:-.2px}
.kc.rest{border-style:dashed;background:transparent;color:var(--muted);font-weight:400}
.measure-grid button.selected .kc.rest{color:var(--white);border-color:var(--white)}
.kc-bar{font-size:11px;color:var(--muted);letter-spacing:.04em}
/* 同時要按的鍵疊成一直行，跟「先後按」在視覺上分開 */
.kc-stack{display:inline-flex;flex-direction:column;gap:2px;padding:2px;border:1px solid var(--muted);border-radius:5px}
.current-note strong i{padding:0 4px;font-size:.5em;font-style:normal;opacity:.55}
.flow button b i{padding:0 2px;font-size:.7em;font-style:normal;opacity:.55}
.measure-grid.keys button.selected .kc{border-color:var(--ink)}.measure-grid small,.measure-grid b,.measure-grid span{display:block}.measure-grid small{font-size:9px;color:#999}.measure-grid b{margin:5px 0;font:700 24px/1 Georgia}.measure-grid span{overflow:hidden;color:#777;font-size:9px;white-space:nowrap;text-overflow:ellipsis}.measure-grid button.selected{background:var(--orange);color:#fff;box-shadow:inset 0 0 0 3px var(--ink)}.measure-grid button.selected small,.measure-grid button.selected span{color:#fff}.measure-grid button.guided{background:#e5f5b0}.sticky-choice{position:sticky;bottom:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:18px;padding:14px 18px;background:var(--acid);border-top:2px solid var(--ink)}.sticky-choice small,.sticky-choice b{display:block}.sticky-choice button,.btn{min-height:44px;padding:0 17px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-weight:900;cursor:pointer}.quick{margin-bottom:42px}.quick-head{display:grid;grid-template-columns:1fr 180px;gap:28px;align-items:center;padding:30px;background:var(--ink);color:#fff}.quick-head h2{margin:6px 0 12px;font:400 clamp(34px,5vw,60px)/1.03 Georgia}.quick-head h2 em{color:var(--acid);font-style:italic}.quick-head p:last-child{color:#ccc;line-height:1.6}.goal{display:grid;place-items:center;align-content:center;aspect-ratio:1;border:9px solid var(--acid);border-radius:50%}.goal b{font:700 54px/1 Georgia}.goal span{font-size:11px}.accuracy{padding:15px 22px;background:#fff0d9;border:2px solid var(--orange);line-height:1.55}.group-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#999}.group-tabs button{min-height:76px;padding:12px;border:0;background:#eeeae1;text-align:left;cursor:pointer}.group-tabs button.on{background:var(--acid)}
.group-tabs.two{grid-template-columns:repeat(2,1fr)}
.white-toggle{margin:14px 0;padding:13px 16px;border:1px solid var(--line);background:var(--white)}
.white-toggle.on{border-color:var(--ink);background:#f5f8e4}
.white-toggle button{padding:9px 16px;border:1px solid var(--ink);background:var(--paper);font:700 15px/1 inherit;cursor:pointer}
.white-toggle.on button{background:var(--acid)}
.white-toggle>b{font-size:16px}
/* 雙手對照：兩手排在同一條時間軸上，直向對齊就看得出誰跟誰同時 */
.two-hand{margin:14px 0}
.th-now{padding:14px 16px;border:2px solid var(--ink);background:var(--acid)}
.th-now small{display:block;margin-bottom:6px;font-size:12px;opacity:.7}
.th-now b{display:block;font-size:19px;line-height:1.5}
.th-now em{font-size:13px;font-style:normal;font-weight:700}
.th-hit{color:#a33208}
.th-keep{color:#4a5230;opacity:.75}
.th-idle{color:var(--muted);font-weight:400!important}
.th-rows{margin-top:10px;overflow-x:auto}
.th-row{display:flex;align-items:stretch;gap:2px;margin-bottom:2px}
.th-label{display:flex;align-items:center;min-width:44px;padding:0 6px;background:var(--ink);color:var(--white);font-size:12px;font-weight:700}
.th-cell{flex:1;min-width:52px;padding:9px 4px;border:1px solid var(--line);background:var(--white);font:inherit;cursor:pointer}
.th-cell.on{border-color:var(--ink);background:#f5f8e4;box-shadow:inset 0 0 0 2px var(--ink)}
.th-new{font-weight:700;font-size:14px}
.th-hold{font-size:14px;color:var(--muted);opacity:.55}
.th-rest{color:var(--line)}
.th-cell i{padding:0 1px;font-size:.7em;font-style:normal;opacity:.5}
.th-tip{margin:8px 0 0;color:var(--muted);font-size:12px;line-height:1.6}
/* 手位建議 */
.pos-hint{margin-top:10px;padding:12px 14px;border-left:4px solid var(--orange);background:#fdf3ef}
.pos-hint.ok{border-left-color:#6b9b2f;background:#f2f7e8}
.pos-hint b{display:block;font-size:15px}
/* 兩種模式的主入口，要一眼看到 */
.mode-bar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
.mode-btn{padding:20px 18px;border:2px solid var(--ink);background:var(--white);text-align:left;cursor:pointer;font:inherit}
.mode-btn b{display:block;font-size:22px;margin-bottom:5px}
.mode-btn small{display:block;color:var(--muted);font-size:13px;line-height:1.5}
.mode-btn.on{background:var(--acid);box-shadow:inset 0 0 0 3px var(--ink)}
.mode-btn.on small{color:#3a3a30}
.guide{margin:0 0 14px;padding:15px 17px;border:1px solid var(--line);background:var(--white)}
.guide.on{border:2px solid #4a7a15;background:#f2f7e8}
.guide>b{display:block;font-size:17px}
.guide p{margin:7px 0 0;color:#4d4b44;font-size:14px;line-height:1.7}
.guide-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.guide-btns button{padding:11px 16px;border:1px solid var(--ink);background:var(--paper);font:700 14px/1 inherit;cursor:pointer}
.guide-btns button.on{background:var(--acid)}
@media(max-width:700px){.mode-bar{grid-template-columns:1fr}}
/* 頂部列：曲名、連線狀態、開啟選單 */
.topline{display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:11px 14px;border:1px solid var(--ink);background:var(--white)}
.menu-btn{flex:none;padding:11px 16px;border:1px solid var(--ink);background:var(--ink);color:var(--white);font:700 15px/1 inherit;cursor:pointer}
.topline-now{min-width:0;line-height:1.4}
.topline-now b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topline-now span{font-size:12px;color:var(--muted)}
/* 左側抽屜：平常收起來，畫面只留「現在要按什麼」 */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(23,23,20,.45);opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;z-index:41;width:min(420px,88vw);height:100%;
  background:var(--paper);border-right:2px solid var(--ink);
  transform:translateX(-102%);transition:transform .2s ease;
  display:flex;flex-direction:column;box-shadow:0 0 30px rgba(0,0,0,.18)}
.drawer.on{transform:none}
.drawer-head{flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px;border-bottom:2px solid var(--ink);background:var(--white)}
.drawer-head b{font-size:18px}
.drawer-head button{padding:7px 12px;border:1px solid var(--ink);background:var(--paper);font:700 16px/1 inherit;cursor:pointer}
.drawer-body{flex:1;overflow-y:auto;padding:14px}
.drawer-body select{width:100%;padding:12px;border:1px solid var(--ink);background:var(--white);font:700 15px/1.3 inherit;color:var(--ink);cursor:pointer}
.drawer-body .measure-grid.keys{grid-template-columns:1fr 1fr}
.drawer-body .score-image img{max-width:100%}
/* 收合區塊：把當下不需要看的東西收起來，整頁才不會長到找不到東西 */
.fold{margin:0 0 10px;border:1px solid var(--ink);background:var(--white)}
.fold>summary{padding:15px 18px;font:700 16px/1.3 inherit;cursor:pointer;list-style:none;
  display:flex;align-items:center;justify-content:space-between}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::after{content:'▾';font-size:14px;opacity:.5;transition:transform .15s}
.fold[open]>summary{border-bottom:1px solid var(--line);background:var(--paper)}
.fold[open]>summary::after{transform:rotate(180deg)}
.fold-body{padding:14px 16px}
.fold-body>.panel{margin:0 0 12px;border:0;box-shadow:none}
.fold-body>.panel:last-child{margin-bottom:0}
.fold-body .tempo,.fold-body .loop-bar,.fold-body .prog,.fold-body .midi,.fold-body .pos-hint{margin-top:0;margin-bottom:10px}
.fold-body .pos-hint:last-child,.fold-body .tempo:last-child{margin-bottom:0}
/* 練習流程 */
.guide-btns button.main{background:var(--ink);color:var(--white);font-size:16px;padding:13px 20px}
.guide-btns button.main.stop{background:var(--orange)}
.drill-in{margin:11px 0 0;padding-top:10px;border-top:1px dashed var(--line);color:var(--muted);font-size:13px}
.drill-in b{color:var(--ink);font-size:15px;letter-spacing:.05em}
.guide-btns.bars{align-items:center;margin-top:8px}
.guide-btns.bars span{color:var(--muted);font-size:13px}
.guide-btns.bars button{padding:8px 12px;font-size:13px}
/* 節奏橫條：長度＝這個音要按多久 */
.flow button{position:relative;padding-bottom:14px!important}
.dur{position:absolute;left:6px;bottom:5px;height:4px;border-radius:2px;background:var(--ink);opacity:.42}
.flow button.on .dur{background:var(--ink);opacity:.85}
.dur-tip{margin:6px 0 0;color:var(--muted);font-size:12px}
/* 速度與節拍器 */
.tempo{margin-top:16px;padding:14px 16px;border:1px solid var(--line);background:var(--white)}
.tempo label{display:block;margin-bottom:9px;font-size:14px}
.tempo label b{font-size:17px}
.tempo input[type=range]{width:100%}
.tempo-ends{display:flex;justify-content:space-between;margin-top:2px;color:var(--muted);font-size:11px}
.tempo button{margin-top:10px;padding:8px 14px;border:1px solid var(--ink);background:var(--paper);font:700 14px/1 inherit;cursor:pointer}
.tempo button.on{background:var(--acid)}
/* 循環練習 */
.loop-bar{margin-top:12px;padding:14px 16px;border:1px solid var(--line);background:var(--white)}
.loop-head{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.loop-head span{color:var(--muted);font-size:13px}
.loop-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.loop-btns button{padding:11px;border:1px solid var(--ink);background:var(--paper);font:600 14px/1.3 inherit;cursor:pointer}
.loop-btns button.main{grid-column:1/-1;background:var(--ink);color:var(--white);font-weight:700}
.loop-btns button.main.on{background:var(--orange)}
/* 自動彈奏播放器 */
.auto{margin-top:12px;padding:14px 16px;border:1px solid var(--ink);background:var(--white)}
.auto-head{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.auto-head b{font-size:15px}
.auto-head span{color:var(--muted);font-size:13px}
.auto-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.auto-row label{color:var(--muted);font-size:13px}
.auto-row input[type=number]{width:76px;padding:8px;border:1px solid var(--ink);border-radius:0;background:var(--paper);font:700 15px/1 inherit}
.auto-opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.auto-opts button{padding:9px 13px;border:1px solid var(--ink);background:var(--paper);font:600 13px/1 inherit;cursor:pointer}
.auto-opts button.on{background:var(--acid);font-weight:700}
.auto-opts button[disabled]{opacity:.4;cursor:default}
.auto-go{display:grid;grid-template-columns:1.6fr 1fr;gap:8px;margin-top:12px}
.auto-go button{min-height:50px;padding:11px;border:1px solid var(--ink);background:var(--paper);font:700 15px/1.3 inherit;cursor:pointer}
.auto-go button.main{background:var(--ink);color:var(--white)}
.auto-go button.main.on{background:var(--orange)}
.auto-go button[disabled]{opacity:.4;cursor:default}
.auto-status{margin-top:10px;padding:11px 13px;border:1px solid var(--line);background:var(--paper);font:400 14px/1.4 inherit}
.auto-status b{font-size:17px}
.auto-status small{display:block;margin-top:4px;color:var(--muted);font-size:12px}
.auto-track{position:relative;height:9px;margin-top:8px;background:#e6e3da;overflow:hidden}
.auto-track i{position:absolute;left:0;top:0;height:100%;background:var(--orange)}
.auto-tip{margin:9px 0 0;color:var(--muted);font-size:12px;line-height:1.65}
/* 正在播放的小節：只加外框，不動版面，才不會在播放中造成整頁重排 */
.measure-grid button.playing{outline:3px solid var(--orange);outline-offset:-3px}
/* 練習進度 */
.prog{margin-top:12px;padding:14px 16px;border:1px solid var(--line);background:var(--white)}
.prog-head{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:baseline}
.prog-head span{color:var(--muted);font-size:13px}
.prog-track{position:relative;height:9px;margin:10px 0;background:#e6e3da;overflow:hidden}
.prog-track i{position:absolute;left:0;top:0;height:100%;background:#6b9b2f}
.prog-track u{position:absolute;top:0;height:100%;background:var(--acid);opacity:.75}
.prog-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.prog-btns button{padding:10px 4px;border:1px solid var(--line);background:var(--paper);font:600 13px/1.2 inherit;cursor:pointer}
.prog-btns button.on{border-color:var(--ink);background:var(--acid);font-weight:700}
.prog small{display:block;margin-top:7px;color:var(--muted);font-size:12px}
/* 接上電鋼琴 */
.midi{margin-top:16px;padding:14px 16px;border:1px solid var(--line);background:var(--white)}
.midi.on{border:2px solid #4a7a15;background:#f2f7e8}
.midi.warn{border-left:4px solid var(--orange);background:#fdf3ef}
.midi-head{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:baseline}
.midi-head b{font-size:16px}
.midi-head span{color:var(--muted);font-size:12px}
.midi-tip{margin:8px 0 0;color:#4d4b44;font-size:13px;line-height:1.7}
.midi-bad{margin:8px 0 0;padding:8px 10px;background:#ffe8e0;border-left:3px solid var(--orange);font-size:14px;font-weight:700}
.midi-stat{margin-top:9px;font-size:15px;font-weight:700}
.midi-opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.midi-opts button,.midi>button{padding:9px 13px;border:1px solid var(--ink);background:var(--paper);font:600 13px/1 inherit;cursor:pointer}
.midi-opts button.on{background:var(--acid);font-weight:700}
.midi-out{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.midi-out>b{display:block;margin-bottom:8px;font-size:14px}
.midi>button.main{margin-top:10px;background:var(--ink);color:var(--white);font-size:15px;font-weight:700;padding:12px 18px}
/* 目錄裡的進度色 */
.measure-grid button.lv1{background:#fbfde8}
.measure-grid button.lv2{background:#eef6e0}
.measure-grid button.lv2 .kc-bar::after{content:'　✓ 已熟';color:#4a7a15;font-weight:700}
.pos-hint small{display:block;margin-top:5px;color:var(--muted);font-size:13px;line-height:1.65}

  const s=impSong(kind.slice(4));
  if(!s)return [];
  const t=impTimes(s,bar,hand);
  if(!t.length)return [];
  const out=[];
  for(let i=0;i<t.length;i++){
    const end=(i+1<t.length)?t[i+1]:1;
    out.push(Math.max(0.01,end-t[i]));
  }
  /* 除以最短的那個音，得到「幾倍長」——1 倍、2 倍、3 倍（附點）之類 */
  const min=Math.min.apply(null,out);
  return out.map(function(v){return v/min})}

/* 把倍數對到常見的音符時值，避免排版誤差讓長度看起來零碎 */
function beatLabel(ratio){
  if(ratio>=3.4)return {w:4,name:'很長'};
  if(ratio>=2.6)return {w:3,name:'長（附點）'};
  if(ratio>=1.7)return {w:2,name:'長'};
  if(ratio>=1.3)return {w:1.5,name:'稍長'};
  return {w:1,name:'短'}}

/* 雙手對照：把左右手排到同一條時間軸上。
   兩手的拍數常常不同（右手八個八分音符、左手一個全音符），所以是以
   右手每一拍為準，去找左手在那個時刻「正按著」哪個和弦——也就是
   時間點在它之前、最靠近的那一個。左手按下去後會一直持續，
   不是每次右手動它就要重按。 */
function twoHandSteps(kind,bar){
  const s=impSong(kind.slice(4));
  if(!s)return [];
  const rh=barChords(kind,bar,'rh'), lh=barChords(kind,bar,'lh');
  const rt=impTimes(s,bar,'rh'), lt=impTimes(s,bar,'lh');
  const lead=rh.length?'rh':'lh';
  const steps=[];
  const primary=lead==='rh'?rh:lh, ptimes=lead==='rh'?rt:lt;
  primary.forEach(function(ch,i){
    const t=ptimes[i]!==undefined?ptimes[i]:i/Math.max(1,primary.length);
    let other=null, otherIdx=-1, isNew=false;
    const oc=lead==='rh'?lh:rh, ot=lead==='rh'?lt:rt;
    for(let k=0;k<oc.length;k++){
      const kt=ot[k]!==undefined?ot[k]:k/Math.max(1,oc.length);
      if(kt<=t+0.02){other=oc[k];otherIdx=k;isNew=Math.abs(kt-t)<=0.02}
    }
    steps.push(lead==='rh'
      ? {rh:ch, lh:other, lhNew:isNew, t:t}
      : {rh:other, lh:ch, rhNew:isNew, t:t});
  });
  return steps}
/* 一顆琴鍵一個小方塊。白鍵直接印編號；黑鍵在實體琴上沒有印數字，
   所以標「夾住它的那兩個白鍵」，並用黑底對應手指要找的黑色鍵。 */
function keyChip(note){return isBlack(note)
  ? '<i class="kc blk">'+whiteNumber(note)+'–'+(whiteNumber(note)+1)+'</i>'
  : '<i class="kc">'+whiteNumber(note)+'</i>'}
/* 只彈白鍵的開關。要說清楚代價：整首移調了，聽起來會比原曲低（或高）一點 */
function whiteToggle(kind){
  const sh=state.white?whiteShift(kind):0;
  return '<div class="white-toggle'+(state.white?' on':'')+'">'
    +'<button data-action="white" data-kind="'+kind+'">'+(state.white?'✓ 只彈白鍵（新手模式）':'切換成只彈白鍵')+'</button>'
    +'<small>'+(state.white
      ? '已整首移調 '+(sh>0?'+':'')+sh+' 個半音，幾乎所有音都落在白鍵。旋律和原曲一樣，只是整體'+(sh<0?'低':'高')+'了一點點。'
      : '黑鍵太多不好上手時，可以整首移調成幾乎全白鍵——同一首歌，只是換個高低。')
    +'</small></div>'}
/* 一個時間點一組。同時要按的鍵用 kc-stack 併在一起，
   才看得出「這兩個是一起按」而不是「先後按」。 */
function chipRow(chords){
  if(!chords.length)return '<div class="kc-row"><i class="kc rest">休</i></div>';
  return '<div class="kc-row">'+chords.map(function(ch){
    return ch.length>1
      ? '<span class="kc-stack">'+ch.map(keyChip).join('')+'</span>'
      : keyChip(ch[0])}).join('')+'</div>'}
/* 不管哪一首曲子，都用這個介面拿「某一小節要按哪些音」。
   內建的一生所愛存的是簡譜級數，匯入曲目存的是音名，這裡統一轉成音名。 */
function rawBarChords(kind,bar,hand){
  if(kind.slice(0,4)==='imp:'){const s=impSong(kind.slice(4));return s?impChords(s,bar,hand):[]}
  if(kind==='life')return lifeSteps(bar).map(function(s){return [s.note]});
  return []}

/* ---------- 只彈白鍵模式 ----------
   新手要先能彈完整首，黑鍵是門檻。做法不是把黑鍵音硬推到隔壁白鍵——那會
   破壞旋律；而是「整首移調」。移調不改變任何音程關係，聽起來是同一首歌，
   只是整體高低不同，卻可以讓幾乎所有音落在白鍵上。
   例：B♭ 小調往下移一個半音就是 A 小調，鋼琴上唯一全白鍵的小調。 */
function allNotesOf(kind){
  const out=[];const total=kind==='life'?114:(impSong(kind.slice(4))||{totalBars:0}).totalBars;
  for(let b=1;b<=total;b++)['rh','lh'].forEach(function(h){
    rawBarChords(kind,b,h).forEach(function(ch){ch.forEach(function(n){if(n)out.push(n)})})});
  return out}
const _shiftCache={};
function whiteShift(kind){
  if(_shiftCache[kind]!==undefined)return _shiftCache[kind];
  const ns=allNotesOf(kind);
  let best=0,bestBlack=Infinity;
  for(let t=-6;t<=6;t++){
    let blk=0;
    ns.forEach(function(n){if(isBlack(noteFromMidi(midi(n)+t)))blk++});
    if(blk<bestBlack||(blk===bestBlack&&Math.abs(t)<Math.abs(best))){bestBlack=blk;best=t}}
  return _shiftCache[kind]=best}
function toWhite(note,shift){
  let m=midi(note)+shift;
  /* 移調後仍在黑鍵的（多半是臨時記號），吸附到下方白鍵 */
  if(isBlack(noteFromMidi(m)))m-=1;
  return noteFromMidi(m)}

/* 這個曲目要不要移調成全白鍵？匯入曲目看它自己的設定，
   一生所愛則沿用畫面上的開關。 */
function isWhiteOnly(kind){
  if(kind.slice(0,4)==='imp:'){const s=impSong(kind.slice(4));return !!(s&&s.whiteOnly)}
  return !!state.white}
/* 入門模式：把「八度加厚」的旋律壓成單音，讓新手一次只按一個鍵。 */
function isMelodyOnly(kind){
  if(kind.slice(0,4)==='imp:'){const s=impSong(kind.slice(4));return !!(s&&s.melodyOnly)}
  return false}
function topNote(chord){
  let best=chord[0];
  chord.forEach(function(n){if(midi(n)>midi(best))best=n});
  return best}
/* 這一疊音是不是「同一個音名、只差八度」？
   八度加厚拿掉一個不會改變任何和聲，可以安全壓成單音；
   但真正的和弦（不同音名）一旦只留最高音，和聲就整個消失——
   原譜第 49–58 小節右手是重複的三音和弦伴奏，那樣簡化會變成
   同一個音一直重複，聽起來完全不像這首曲子。 */
function isOctaveStack(chord){
  if(chord.length<2)return false;
  const pc=midi(chord[0])%12;
  return chord.every(function(n){return midi(n)%12===pc})}

function barChords(kind,bar,hand){
  let chords=rawBarChords(kind,bar,hand);
  if(!chords.length)return chords;
  if(isMelodyOnly(kind)&&hand==='rh')
    /* 只壓縮八度加厚，真和弦原樣保留，否則和聲會不見 */
    chords=chords.map(function(ch){return isOctaveStack(ch)?[topNote(ch)]:ch});
  if(isWhiteOnly(kind)){
    const sh=whiteShift(kind);
    chords=chords.map(function(ch){return ch.map(function(n){return toWhite(n,sh)})})}
  return chords}
/* 攤平版：只給「這一小節用到哪些鍵」這類不在意同時性的地方用 */
function barNotes(kind,bar,hand){
  return barChords(kind,bar,hand).reduce(function(a,ch){return a.concat(ch)},[])}
/* 這首曲子是不是每一小節都有音符？有的話目錄就改用琴鍵數字版面 */
function hasBarNotes(kind){return kind.slice(0,4)==='imp:'||kind==='life'}
function barTag(kind,n){
  const c=barNotes(kind,n,state.hand==='both'?'rh':state.hand).length;
  return c?c+' 音':'逐小節練習'}

function renderImported(){
  const song=impCurrent();
  if(!song)return '<section class="panel"><h2>找不到這首曲目</h2></section>';
  const bar=Math.max(1,Math.min(song.totalBars,state.impBar));
  /* 頁碼也要夾在範圍內。曲目的頁數不一樣多，從 4 頁的曲子切到 1 頁的曲子時，
     殘留的 impPage 會讓 pages[page] 變成 undefined，整個畫面就當掉。 */
  if(state.impPage>=song.pages.length||state.impPage<0)
    state.impPage=pageForBar(song.pages,bar);
  /* 一律走 barChords，它會套用移調與單音簡化；直接呼叫 impChords 會繞過。
     跟彈是按「時間點」推進，不是按單音——一個時間點可能要同時按好幾個鍵。 */
  const kind='imp:'+song.id;
  const chords=barChords(kind,bar,state.hand);
  const notes=barNotes(kind,bar,state.hand);
  const spans=beatSpans(kind,bar,state.hand==='both'?'rh':state.hand);
  const idx=chords.length?state.noteIndex%chords.length:0;
  const cur=chords[idx]||[];
  const other=state.hand==='rh'?'lh':'rh';
  const mode=state.mode||'practice';
  if(mode==='auto')
    /* 自動彈奏時只要播放器，其餘一律收進側邊選單 */
    return topBar(song)+modeBar()+autoPanel(song,bar)+drawer(song,bar);
  return topBar(song)+modeBar()
    +'<section class="panel"><div class="practice-box">'
    +'<p class="eyebrow">逐小節跟彈 · 音符由 PDF 自動辨識</p>'
    +'<h2>第 '+bar+' 小節<small style="font-weight:400;font-size:14px;opacity:.6"> ／ 全曲 '+song.totalBars+' 小節</small></h2>'
    +'<div class="notice">大數字是 88 鍵電鋼琴的白鍵編號（白鍵 1–52，中央 C 是 24）。'
    +(song.whiteOnly?'這一版整首都不用黑鍵。':'本曲調號：'+song.key+'（含黑鍵）')+'</div>'
    +(song.melodyOnly
      ? '<div class="white-toggle on"><b>入門版</b><small>整首已移調 '
        +(whiteShift(kind)>0?'+':'')+whiteShift(kind)
        +' 個半音全部落在白鍵。原譜中後段的旋律是八度加厚（同一個音高低各按一個），'
        +'這一版只留上面那個音，旋律完全一樣但一次只按一個鍵。'
        +'第 49–58 小節右手是三音和弦的伴奏，那裡照原樣保留——'
        +'只留一個音的話和聲會不見，聽起來就不像這首歌了。</small></div>'
      : song.whiteOnly
      ? '<div class="white-toggle on"><b>純白鍵版</b><small>整首已移調 '
        +(whiteShift(kind)>0?'+':'')+whiteShift(kind)
        +' 個半音，全部落在白鍵上。旋律與原曲完全一樣，只是整體高低不同。'
        +'中後段右手是八度雙音，格子裡框在一起的兩個數字要同時按。</small></div>'
      : '<div class="white-toggle"><b>原調版</b><small>照原譜的調，會用到黑鍵，'
        +'中後段右手還有八度雙音。剛開始覺得難，先從上面的單音入門版練起。</small></div>')
    +'<div class="group-tabs"><button class="'+(state.hand==='rh'?'on':'')+'" data-action="imp-hand" data-hand="rh"><small>① 先練這隻手</small><b>右手（旋律）</b></button>'
    +'<button class="'+(state.hand==='lh'?'on':'')+'" data-action="imp-hand" data-hand="lh"><small>② 熟了再單獨練</small><b>左手（伴奏）</b></button>'
    +'<button class="'+(state.hand==='both'?'on':'')+'" data-action="imp-hand" data-hand="both"><small>③ 兩手都會了再合</small><b>雙手合起來</b></button></div>'
    +(state.hand==='both' ? twoHandPanel(kind,bar) :
      chords.length
      ? '<div class="current-note"><strong>'+cur.map(numberLabel).join('<i>+</i>')+'</strong>'
        +'<div><b>請'+(cur.length>1?'同時按　':'按')+cur.map(keyLabel).join('　和　')+'</b>'
        +'<small>第 '+(idx+1)+'／'+chords.length+' 拍 · 音名 '+cur.join(' + ')+'</small></div></div>'
        +'<div class="flow">'+chords.map(function(ch,i){
            const sp=spans[i]?beatLabel(spans[i]):{w:1,name:''};
            return '<button class="'+(i===idx?'on':'')+'" data-action="imp-note" data-index="'+i+'">'
              +'<b>'+ch.map(numberLabel).join('<i>+</i>')+'</b><small>'+ch.join('+')+'</small>'
              /* 橫條長度＝這個音要按多久，一眼看出長短 */
              +'<span class="dur" style="width:'+Math.min(100,sp.w*22)+'%" title="'+sp.name+'"></span>'
              +'</button>'}).join('')+'</div>'
      : '<div class="notice">這一小節在'+(state.hand==='rh'?'右':'左')+'手是休止，換另一隻手或跳到下一小節。</div>')
    +'</div>'+keyboard(
        state.hand==='both'
          ? (function(){const s=twoHandSteps(kind,bar)[state.noteIndex%Math.max(1,twoHandSteps(kind,bar).length)];
             return s?[].concat(s.rh||[],s.lh||[]):null})()
          : (cur[0]||null),
        state.hand==='both'
          ? barNotes(kind,bar,'rh').concat(barNotes(kind,bar,'lh'))
          : notes)
    +'<div class="score-controls">'
    +'<button data-action="imp-bar" data-bar="'+(bar-1)+'" '+(bar===1?'disabled':'')+'>← 上一小節</button>'
    +'<button class="main" data-action="imp-listen">▶ 播放本小節</button>'
    +'<button data-action="imp-bar" data-bar="'+(bar+1)+'" '+(bar===song.totalBars?'disabled':'')+'>下一小節 →</button></div>'
    +'<div class="score-controls"><button data-action="imp-swap">切換到'+(other==='rh'?'右':'左')+'手</button>'
    +'<button data-action="imp-listen-both">▶ 雙手一起播放</button></div>'
    +'</section>'
    +drawer(song,bar)}

/* ---------- 頂部列與側邊選單 ----------
   平常畫面只留「現在要按什麼」，設定與工具收在左側抽屜裡。
   功能一多，全部攤在同一頁就會變成得一直捲才找得到東西。 */
function topBar(song){
  const lit=midiIO.status==='ready';
  return '<div class="topline">'
    +'<button class="menu-btn" data-action="drawer">☰　設定與工具</button>'
    +'<div class="topline-now"><b>'+song.title+'</b>'
    +'<span>'+(lit?'● 電鋼琴已連線':'○ 未接琴')+'</span></div></div>'}

function drawer(song,bar){
  const open=!!state.drawer;
  const kind='imp:'+song.id;
  const notes=barNotes(kind,bar,state.hand==='both'?'rh':state.hand);
  return '<div class="scrim'+(open?' on':'')+'" data-action="drawer-close"></div>'
    +'<aside class="drawer'+(open?' on':'')+'">'
    +'<div class="drawer-head"><b>設定與工具</b>'
    +'<button data-action="drawer-close" aria-label="關閉">✕</button></div>'
    +'<div class="drawer-body">'
    +fold('d-song','選擇曲目',songPicker(),true)
    +fold('d-hint','手位與節奏提示',
      (state.hand!=='both'&&notes.length?handHint(notes,state.hand):'')
      +'<p class="dur-tip">音符下方的橫條是<b>這個音要按多久</b>——長條要按住，短條快放。</p>',false)
    +fold('d-drill','反覆練習　·　進度　·　速度',
      loopBar(song,bar)+progressBar(song,bar)+tempoBar(),false)
    +fold('d-score','曲譜與小節目錄',
      scorePanel(song.pages,state.impPage,kind,song.title+'　原譜')
      +measureCatalog(song.pages,bar,kind,song.totalBars),false)
    +fold('d-midi','接上電鋼琴',midiPanel(),midiIO.status!=='ready')
    +'</div></aside>'}

/* 曲目選單搬進抽屜，主畫面就不必再放一排 */
function songPicker(){
  const opts=songOptions();
  return '<select id="songSelect" aria-label="選擇曲目">'
    +opts.map(function(o,i){
      return '<option value="'+o.value+'"'+(o.value===state.song?' selected':'')+'>'
        +String(i+1).padStart(2,'0')+'　'+o.title+'　（'+o.tag+'　'+o.bars+' 小節）</option>'}).join('')
    +'</select>'}

/* ---------- 可收合區塊 ----------
   功能一路加上來，整頁變得很長，要找東西得一直捲。把「當下不需要看」的
   東西收起來，只留正在做的事。展開狀態要記住——每次 render 都重置的話，
   使用者剛打開的東西又會被關上。 */
function fold(key,title,content,defaultOpen){
  if(!content)return '';
  const st=state.fold||{};
  const open=st[key]!==undefined?st[key]:defaultOpen;
  return '<details class="fold"'+(open?' open':'')+' data-fold="'+key+'">'
    +'<summary>'+title+'</summary><div class="fold-body">'+content+'</div></details>'}

document.addEventListener('toggle',function(e){
  const d=e.target;
  if(!d||!d.dataset||!d.dataset.fold)return;
  if(!state.fold)state.fold={};
  state.fold[d.dataset.fold]=d.open;save()},true);

/* ---------- 兩種使用模式 ----------
   這是整個程式的主入口，所以放最上面、做大。使用者要的不是一堆設定，
   而是「我現在要做哪件事」——聽琴彈給我聽，還是跟著發光的鍵練。 */
function modeBar(){
  const m=state.mode||'practice';
  const lit=midiIO.outs&&midiIO.outs.length;
  return '<section class="mode-bar">'
    +'<button class="mode-btn'+(m==='practice'?' on':'')+'" data-action="mode" data-mode="practice">'
    +'<b>✋ 輔助練習</b><small>'+(lit?'琴鍵會發光，跟著按就對了':'跟著螢幕上高亮的鍵按')+'</small></button>'
    +'<button class="mode-btn'+(m==='auto'?' on':'')+'" data-action="mode" data-mode="auto">'
    +'<b>▶ 自動彈奏</b><small>'+(lit?'讓琴自己把整首彈出來':'讓電腦把整首播出來')+'</small></button>'
    +'</section>'
    +(m==='practice'?practiceGuide(lit):'')}

/* 輔助練習：一個明確的流程，不是一堆開關。
   開始之後就一直跑——亮一個鍵、你按、對了亮下一個，走完整個小節再從頭，
   直到你按停止。只亮一個然後結束，那不叫練習。 */
function practiceGuide(lit){
  const inOk=midiIO.status==='ready'&&midiIO.inputs&&midiIO.inputs.length;
  const on=state.drillOn;
  if(!inOk)
    return '<div class="guide">'
      +'<b>先接上你的電鋼琴</b>'
      +'<p>接上之後，琴鍵會亮起下一個要按的鍵，你按對了就自動亮下一個，'
      +'可以整個小節反覆練到熟。<br>沒有接琴也能練——照著下面的大數字按就好。</p>'
      +'<div class="guide-btns"><button data-action="midi-connect">連接電鋼琴</button></div></div>';

  const s=impCurrent();
  const r=s?drillRange(s):[1,1];
  const n=Math.max(1,Number(state.drillBars)||1);
  const recent=(midiIO.recent||[]).slice(-5).map(numberLabel).join('　');
  const ph=drill.phase==='preview'?'整段預覽中——先把手擺到亮起來的鍵上'
          :drill.phase==='play'?'跟著燈按下去'
          :'';

  return '<div class="guide'+(on?' on':'')+'">'
    +'<b>'+(on?'● 練習中　第 '+r[0]+(r[1]>r[0]?'–'+r[1]:'')+' 小節'+(ph?'　·　'+ph:'')
              :'跟著發光的琴鍵練')+'</b>'
    +'<p>'+(on
      ? '先整段亮起來讓你把手擺好，接著燈會照著譜上的節奏一顆一顆往前走，你跟著彈。'
        +'走完會'+(state.drillLoop?'從這一段開頭再來一次':'接到下一段')+'。'
      : '一次練 '+n+' 個小節。開始後會先把整段要按的鍵全部亮起來，'
        +'讓你把手擺好，然後燈就照著節奏走，你跟著按。')+'</p>'
    +'<div class="guide-btns">'
    +'<button class="main'+(on?' stop':'')+'" data-action="drill">'
      +(on?'■ 停止練習':'▶ 開始跟著燈練習')+'</button>'
    +'<button class="'+(state.drillLoop?'on':'')+'" data-action="drill-loop">'
      +(state.drillLoop?'✓ 這一段反覆練':'走完接下一段')+'</button>'
    +'</div>'
    +'<div class="guide-btns bars"><span>一次練</span>'
    +[1,2,4].map(function(k){
        return '<button class="'+(n===k?'on':'')+'" data-action="drill-bars" data-n="'+k+'">'
          +k+' 小節</button>'}).join('')
    +'</div>'
    /* 把收到的按鍵印出來。按了沒反應時，這行能區分是「琴沒送訊號」還是「按錯」 */
    +'<p class="drill-in">剛才收到你按的鍵：<b>'+(recent||'（還沒收到）')+'</b></p>'
    +'</div>'}

/* 速度。新手要先用很慢的速度把音按對，再慢慢加快 */
function tempoBar(){
  return '<div class="tempo"><label>播放速度　<b>♩ = '+state.bpm+'</b>'
    +(state.bpm<=40?'（很慢，適合剛開始）':state.bpm<=56?'（中等）':'（接近原速）')+'</label>'
    +'<input data-action="tempo" type="range" min="24" max="80" value="'+state.bpm+'">'
    +'<div class="tempo-ends"><span>慢</span><span>快</span></div>'
    +'<button class="'+(state.metro?'on':'')+'" data-action="metro">'
    +(state.metro?'✓ 節拍器開著':'開節拍器')+'</button></div>'}

/* 循環練習：指定一小段反覆播放。重複練一小段是唯一有效的練琴方式 */
function loopBar(song,bar){
  const a=state.loopA||bar, b=state.loopB||bar;
  return '<div class="loop-bar"><div class="loop-head"><b>反覆練習這一段</b>'
    +'<span>第 '+a+' – '+b+' 小節'+(b>=a?'（共 '+(b-a+1)+' 小節）':'')+'</span></div>'
    +'<div class="loop-btns">'
    +'<button data-action="loop-a">起點設為第 '+bar+' 小節</button>'
    +'<button data-action="loop-b">終點設為第 '+bar+' 小節</button>'
    +'<button class="main'+(state.looping?' on':'')+'" data-action="loop-play">'
    +(state.looping?'■ 停止反覆':'▶ 反覆播放')+'</button>'
    +'</div></div>'}

/* 進度：看得見的進展，否則 75 個小節會讓人放棄 */
function progressBar(song,bar){
  const p=(state.progress&&state.progress[song.id])||{};
  const done=Object.keys(p).filter(function(k){return p[k]===2}).length;
  const learning=Object.keys(p).filter(function(k){return p[k]===1}).length;
  const lv=p[bar]||0;
  return '<div class="prog"><div class="prog-head"><b>練習進度</b>'
    +'<span>已熟 '+done+'　練過 '+learning+'　／ 全曲 '+song.totalBars+' 小節</span></div>'
    +'<div class="prog-track"><i style="width:'+(done/song.totalBars*100)+'%"></i>'
    +'<u style="width:'+(learning/song.totalBars*100)+'%"></u></div>'
    +'<div class="prog-btns">'
    +'<button class="'+(lv===0?'on':'')+'" data-action="mark" data-lv="0">還沒練</button>'
    +'<button class="'+(lv===1?'on':'')+'" data-action="mark" data-lv="1">練過了</button>'
    +'<button class="'+(lv===2?'on':'')+'" data-action="mark" data-lv="2">已經熟了</button>'
    +'</div><small>標記的是第 '+bar+' 小節</small></div>'}

/* ---------- 手位建議 ----------
   手張開一次大約只能舒服覆蓋五個白鍵（五指位置）。右手拇指在最低音那端、
   左手拇指在最高音那端，所以兩手的「拇指該放哪」是相反方向算的。
   跨度超過五個白鍵就沒辦法一個手位彈完，必須換手位或用跨指。 */
function handPosition(notes,hand){
  const ws=notes.filter(Boolean).map(whiteNumber);
  if(!ws.length)return null;
  const lo=Math.min.apply(null,ws), hi=Math.max.apply(null,ws);
  const span=hi-lo+1;
  return {lo:lo, hi:hi, span:span, thumb:hand==='lh'?hi:lo, oneShape:span<=5}}

function handHint(notes,hand){
  const p=handPosition(notes,hand);
  if(!p)return '';
  const name=hand==='lh'?'左手':'右手';
  const dir=hand==='lh'?'往左（低音方向）':'往右（高音方向）';
  return '<div class="pos-hint'+(p.oneShape?' ok':'')+'">'
    +'<b>'+name+'拇指放白鍵 '+p.thumb+' 號</b>'
    +'<small>'+(p.oneShape
      ? '其餘手指'+dir+'依序擺好，這一小節跨 '+p.span+' 個白鍵（'+p.lo+'–'+p.hi+'），手不用移動就彈得完。'
      : '這一小節跨 '+p.span+' 個白鍵（'+p.lo+'–'+p.hi+'），超過一個手位，中途要移動手或用拇指穿過。'
        +'先把手放在 '+p.thumb+' 號，彈到構不到的地方再移。')
    +'</small></div>'}

/* 雙手對照面板：把兩手排在同一條時間軸上逐拍列出 */
function twoHandPanel(kind,bar){
  const steps=twoHandSteps(kind,bar);
  if(!steps.length)return '<div class="notice">這一小節兩手都是休止。</div>';
  const rhAll=barNotes(kind,bar,'rh'), lhAll=barNotes(kind,bar,'lh');
  const idx=state.noteIndex%steps.length;
  const st=steps[idx];
  const cell=function(ch,fresh){
    if(!ch||!ch.length)return '<span class="th-rest">—</span>';
    return '<span class="'+(fresh?'th-new':'th-hold')+'">'
      +ch.map(numberLabel).join('<i>+</i>')+'</span>'};
  /* 明講「按下去」還是「繼續壓著」。只用淡色區分，使用者會不確定
     左手到底該不該再點一次——這是實際被問過的問題。 */
  const line=function(label,ch,fresh){
    if(!ch||!ch.length)return '<b>'+label+' <em class="th-idle">這一拍沒有音</em></b>';
    return '<b>'+label+' '+ch.map(numberLabel).join(' + ')
      +(fresh?' <em class="th-hit">← 現在按下去</em>'
             :' <em class="th-keep">← 繼續壓著，不用重按</em>')+'</b>'};
  return '<div class="two-hand">'
    +'<div class="th-now"><div><small>第 '+(idx+1)+'／'+steps.length+' 拍</small>'
    +line('右手',st.rh,st.rhNew!==false)
    +line('左手',st.lh,st.lhNew)+'</div></div>'
    +'<div class="th-rows">'
    +'<div class="th-row"><span class="th-label">右手</span>'
      +steps.map(function(s,i){return '<button class="th-cell '+(i===idx?'on':'')
        +'" data-action="imp-note" data-index="'+i+'">'+cell(s.rh,s.rhNew!==false)+'</button>'}).join('')+'</div>'
    +'<div class="th-row"><span class="th-label">左手</span>'
      +steps.map(function(s,i){return '<button class="th-cell '+(i===idx?'on':'')
        +'" data-action="imp-note" data-index="'+i+'">'+cell(s.lh,s.lhNew)+'</button>'}).join('')+'</div>'
    +'</div>'
    +'<p class="th-tip"><b>深色＝這一拍要按下去；淡色＝那隻手維持不動、繼續壓著剛才的鍵，不要重按。</b>'
    +'左手常常是一個長音撐滿整個小節，右手在上面連續彈好幾個音——那種時候左手整排都會是淡色。</p>'
    +handHint(rhAll,'rh')+handHint(lhAll,'lh')
    +'</div>'}

/* ---------- 接上電鋼琴（Web MIDI）----------
   琴的 USB-C 孔可傳輸 MIDI，接上電腦後瀏覽器就讀得到你按了哪個鍵，
   可以當場判斷彈對沒有。

   兩個限制要知道：
   - Web MIDI 只在 https 或 localhost 底下可用。直接雙擊開啟檔案
     （file://）拿不到權限。
   - Safari 不支援，要用 Chrome 或 Edge。 */
const midiIO={access:null,inputs:[],status:'idle',error:'',pending:[],timer:null};

function midiSupported(){return typeof navigator!=='undefined'&&!!navigator.requestMIDIAccess}
function midiSecure(){return location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'}

function midiConnect(){
  if(!midiSupported()){midiIO.status='unsupported';render();return}
  if(!midiSecure()){midiIO.status='insecure';render();return}
  midiIO.status='connecting';render();
  navigator.requestMIDIAccess().then(function(access){
    midiIO.access=access;
    const bind=function(){
      midiIO.inputs=[];midiIO.outs=[];
      access.inputs.forEach(function(inp){
        midiIO.inputs.push(inp.name||'MIDI 裝置');
        inp.onmidimessage=onMidiMessage});
      /* MIDI 是雙向的。反方向（電腦→琴）可以讓琴用自己的音色發聲，
         有鍵盤燈的琴通常也會跟著把對應的鍵點亮。 */
      access.outputs.forEach(function(out){midiIO.outs.push(out)});
      midiIO.status=midiIO.inputs.length?'ready':'nodevice';
      render()};
    bind();
    access.onstatechange=bind;
  }).catch(function(e){
    midiIO.status='denied';midiIO.error=String(e&&e.message||e);render()})}

/* ---------- 送訊號給琴 ----------
   Note On 除了讓琴發聲，有鍵盤燈的琴多半也會把對應的鍵點亮。
   但有些琴的燈只跟內建示範曲連動、不吃外部 MIDI——這沒辦法從規格判斷，
   只能實際送出去試，所以介面上提供測試按鈕。 */
function midiSend(bytes){
  if(!midiIO.outs||!midiIO.outs.length)return false;
  midiIO.outs.forEach(function(o){try{o.send(bytes)}catch(e){}});
  return true}

/* 熄掉目前亮著的燈 */
function midiLightsOff(){
  (midiIO.lit||[]).forEach(function(m){
    for(let ch=0;ch<16;ch++)midiSend([0x80|ch,m,0])});
  midiIO.lit=[]}

/* 點亮指定的鍵。ms 傳 0（或不傳）表示一直亮著不自動熄——
   練習時燈要留在那裡等你按，亮一下就滅的話根本來不及看。 */
function midiLight(notes,ms,vel){
  const v=vel===undefined?1:vel;   /* velocity 1：盡量只點燈、不發出大聲響 */
  const ns=(notes||[]).filter(Boolean).map(midi);
  if(!ns.length)return false;
  midiLightsOff();
  /* 有些琴會把收到的 Note On 原樣回送給電腦（MIDI thru）。若不擋掉，
     我們送出去點燈的那顆音會被當成「使用者按了鍵」，練習會自己往前跑。
     記下剛送出的音，短時間內收到同一顆就忽略。 */
  if(!midiIO.echo)midiIO.echo={};
  const now=Date.now();
  ns.forEach(function(m){midiIO.echo[m]=now});
  /* 掃過全部 16 個 channel：有些琴的燈只吃特定 channel，不一定是 1 */
  let ok=false;
  ns.forEach(function(n){
    for(let ch=0;ch<16;ch++) if(midiSend([0x90|ch,n,v])) ok=true});
  if(!ok)return false;
  midiIO.lit=ns.slice();
  if(ms>0) setTimeout(function(){midiLightsOff()},ms);
  return true}

/* 讓琴用自己的音色彈這一顆音，取代瀏覽器的合成音 */
function pianoOut(note,dur){
  return midiLight([note],Math.max(200,(dur||0.6)*1000),96)}

/* 依設定決定聲音從哪裡出來 */
function sound(note,dur){
  if(state.useKeyboardSound&&midiIO.outs&&midiIO.outs.length){
    if(pianoOut(note,dur))return}
  playPiano(note,dur)}

/* 目前該按的鍵，在琴上點亮 */
function lightCurrent(){
  if(!state.lightKeys)return;
  if(state.song.slice(0,4)!=='imp:')return;
  const s=impCurrent();if(!s)return;
  const kind='imp:'+s.id;
  const hand=state.hand==='both'?'rh':state.hand;
  const chords=barChords(kind,state.impBar,hand);
  const cur=chords[state.noteIndex%Math.max(1,chords.length)];
  if(cur&&cur.length)midiLight(cur,0,1)}   /* 0 = 一直亮著等你按 */

function onMidiMessage(ev){
  const d=ev.data;if(!d||d.length<3)return;
  const cmd=d[0]&0xf0, note=d[1], vel=d[2];
  if(cmd===0x90&&vel>0)midiNoteOn(note,vel)}

/* 和弦要同時按下好幾個鍵，但它們不會在同一毫秒抵達。
   收集一小段時間內按下的音再一起比對，否則按和弦永遠會被判成錯。 */
function midiNoteOn(n,vel){
  /* 擋掉自己送出去點燈的回授。
     判別關鍵是**力度**不是時間：點燈送的是 velocity 1，回授回來也是 1，
     而真人按鍵通常在 40 以上。用時間窗判斷會把「看到燈亮就立刻按下去」
     的正常操作也擋掉——那正是使用者最該被接受的動作。 */
  if(vel!==undefined&&vel<=2&&midiIO.echo&&midiIO.echo[n]&&Date.now()-midiIO.echo[n]<600){
    delete midiIO.echo[n];return}
  /* 留最近幾顆給畫面顯示，方便判斷是琴沒送訊號還是真的按錯 */
  if(!midiIO.recent)midiIO.recent=[];
  midiIO.recent.push(noteFromMidi(n));
  if(midiIO.recent.length>8)midiIO.recent.shift();
  if(state.song.slice(0,4)!=='imp:')return;
  midiIO.pending.push(n);
  if(midiIO.timer)clearTimeout(midiIO.timer);
  midiIO.timer=setTimeout(function(){
    const played=midiIO.pending.slice();midiIO.pending=[];
    checkPlayed(played)},70)}

function checkPlayed(played){
  const s=impCurrent();if(!s)return;
  const kind='imp:'+s.id;
  const hand=state.hand==='both'?'rh':state.hand;
  const chords=state.hand==='both'
    ? twoHandSteps(kind,state.impBar).map(function(st){return [].concat(st.rh||[],st.lhNew?(st.lh||[]):[])})
    : barChords(kind,state.impBar,hand);
  if(!chords.length)return;
  const want=chords[state.noteIndex%chords.length]||[];
  const wantMidi=want.map(midi).sort(function(a,b){return a-b});
  const gotMidi=played.slice().sort(function(a,b){return a-b});
  const same=state.ignoreOctave
    ? sameSet(wantMidi.map(function(v){return v%12}),gotMidi.map(function(v){return v%12}))
    : sameSet(wantMidi,gotMidi);
  if(same){
    state.hit=(state.hit||0)+1;state.wrong=0;
    state.noteIndex++;
    if(state.noteIndex>=chords.length){
      state.noteIndex=0;
      /* 整個小節都對了：反覆模式就留在原地再來一次，否則前進到下一小節 */
      if(state.drillLoop){ /* 留在同一小節，noteIndex 已歸零 */ }
      else if(state.autoAdvance&&state.impBar<s.totalBars)impSelectBar(s,state.impBar+1);
      state.drillRound=(state.drillRound||0)+1}
  }else{
    state.miss=(state.miss||0)+1;state.wrong=1;
    state.wrongNotes=gotMidi.map(function(v){return noteFromMidi(v)})}
  render()}

function sameSet(a,b){
  if(a.length!==b.length)return false;
  const A=a.slice().sort(),B=b.slice().sort();
  for(let i=0;i<A.length;i++)if(A[i]!==B[i])return false;
  return true}

function midiPanel(){
  const st=midiIO.status;
  const box=function(cls,inner){return '<div class="midi '+cls+'">'+inner+'</div>'};
  if(st==='ready'){
    const hit=state.hit||0, miss=state.miss||0, tot=hit+miss;
    return box('on',
      '<div class="midi-head"><b>✓ 電鋼琴已連上</b><span>'+midiIO.inputs.join('、')+'</span></div>'
      +'<p class="midi-tip">直接在琴上彈。<b>彈對會自動跳到下一個音</b>，彈錯會標紅。</p>'
      +(state.wrong?'<p class="midi-bad">彈錯了：你按的是 '+(state.wrongNotes||[]).map(numberLabel).join(' + ')+'　再試一次</p>':'')
      +'<div class="midi-stat">正確 '+hit+'　錯 '+miss+(tot?'　正確率 '+Math.round(hit/tot*100)+'%':'')+'</div>'
      +'<div class="midi-opts">'
      +'<button class="'+(state.ignoreOctave?'on':'')+'" data-action="midi-oct">'+(state.ignoreOctave?'✓ ':'')+'不管高低八度</button>'
      +'<button class="'+(state.autoAdvance?'on':'')+'" data-action="midi-auto">'+(state.autoAdvance?'✓ ':'')+'整小節對了就前進</button>'
      +'<button data-action="midi-reset">歸零統計</button></div>'
      /* 反向通道：讓琴發聲、讓琴的鍵盤燈亮起來 */
      +(midiIO.outs&&midiIO.outs.length
        ? '<div class="midi-out"><b>把訊號送回琴上</b>'
          +'<div class="midi-opts">'
          +'<button class="'+(state.lightKeys?'on':'')+'" data-action="midi-light">'
          +(state.lightKeys?'✓ ':'')+'點亮該按的鍵</button>'
          +'<button class="'+(state.useKeyboardSound?'on':'')+'" data-action="midi-sound">'
          +(state.useKeyboardSound?'✓ ':'')+'用琴的音色發聲</button>'
          +'<button data-action="midi-test">測試：點亮中央 C</button></div>'
          +'<p class="midi-tip">你的琴有「鍵盤燈」功能，但有些琴的燈只跟內建示範曲連動、'
          +'不接受電腦控制。<b>按一下測試鍵，盯著琴上中央 C（白鍵 24 號）看會不會亮</b>——'
          +'訊號會在約 1.5 秒內掃過全部 16 個 MIDI 頻道，只要這台琴的燈吃任何一個就會亮。</p>'
          +(state.lightTested?'<p class="midi-tip"><b>亮了</b> → 把「點亮該按的鍵」打開就能用。'
            +'<b>沒亮</b> → 這台琴的燈不吃外部 MIDI，把這個功能忽略即可；'
            +'旁邊的「用琴的音色發聲」不受影響，那個一定可用。</p>':'')
          +'</div>'
        : '<p class="midi-tip">（沒有偵測到可以送訊號回去的 MIDI 輸出埠，'
          +'所以無法點亮琴鍵或用琴的音色發聲。）</p>'));}
  if(st==='connecting')return box('','<b>正在連接…</b>');
  if(st==='nodevice')return box('warn','<b>找不到琴</b>'
    +'<p class="midi-tip"><b>最常見的原因是線只能充電、不能傳資料</b>——兩種線外觀一模一樣，'
    +'插上去琴會有反應，但電腦認不到。Apple 原廠的 USB-C 充電線就是這種，隨琴附的線也常是。'
    +'請改用手機傳照片那條，或包裝上標示支援資料傳輸的線。</p>'
    +'<p class="midi-tip">依序檢查：①琴要開機　②換一條能傳資料的 USB-C 線　'
    +'③用 macOS 的「音訊 MIDI 設定」→ 視窗 → 顯示 MIDI 工作室，看得到琴的名字才算接通。</p>'
    +'<button data-action="midi-connect">重新偵測</button>');
  if(st==='denied')return box('warn','<b>沒有取得權限</b><p class="midi-tip">瀏覽器要問你「允許使用 MIDI 裝置」，請選允許。'+(midiIO.error?'（'+midiIO.error+'）':'')+'</p><button data-action="midi-connect">再試一次</button>');
  if(st==='unsupported')return box('warn','<b>這個瀏覽器不支援</b><p class="midi-tip">請改用 Chrome 或 Edge。Safari 沒有 MIDI 功能。</p>');
  if(st==='insecure')return box('warn','<b>這個開啟方式無法使用 MIDI</b><p class="midi-tip">直接雙擊檔案（file://）拿不到 MIDI 權限。請改用 <b>http://localhost:8777/</b> 或線上版網址開啟。</p>');
  return box('',
    '<div class="midi-head"><b>接上你的電鋼琴</b><span>選配</span></div>'
    +'<p class="midi-tip">你的琴 USB-C 孔可以傳 MIDI。接上電腦後，'
    +'程式就能知道你按了哪個鍵——<b>彈對自動跳下一個音，彈錯當場標紅</b>。</p>'
    +'<p class="midi-tip">要用<b>能傳資料</b>的 USB-C 線（只能充電的線接了也認不到）、'
    +'琴要開機、瀏覽器要用 Chrome 或 Edge。</p>'
    +'<button class="main" data-action="midi-connect">連接電鋼琴</button>')}

/* ---------- 整段跟燈練習 ----------
   一次只餵一顆音、按了才亮下一顆，練起來是斷的，沒有節奏可言。
   真正練琴是「看一小段、彈一小段」，所以改成以小節為單位：

   第一階段 先把整段會用到的鍵全部亮起來，讓手有時間找位置；
   第二階段 燈依照譜上的節奏依序走，你跟著彈；
   走完停一拍再從頭，一直反覆到你按停止。 */
const drill={timers:[],phase:''};

function drillClear(){
  drill.timers.forEach(function(t){clearTimeout(t)});
  drill.timers=[];}

function drillStop(){
  drillClear();drill.phase='';
  midiLightsOff();
  state.drillOn=false;}

function drillRange(song){
  const n=Math.max(1,Number(state.drillBars)||1);
  const from=Math.max(1,Math.min(song.totalBars,state.impBar));
  return [from,Math.min(song.totalBars,from+n-1)]}

function drillRun(){
  if(!state.drillOn)return;
  const song=impCurrent();if(!song)return drillStop();
  const kind='imp:'+song.id;
  const hand=state.hand==='both'?'rh':state.hand;
  const r=drillRange(song),from=r[0],to=r[1];
  const barSec=autoBarSec();
  drillClear();

  /* 第一階段：整段的鍵一起亮，讓手先擺好位置 */
  const all=[];
  for(let b=from;b<=to;b++)
    barChords(kind,b,hand).forEach(function(c){c.forEach(function(n){if(n)all.push(n)})});
  const uniq=all.filter(function(v,i,a){return a.indexOf(v)===i});
  if(!uniq.length){ /* 這段沒有音就直接跳過 */
    drill.timers.push(setTimeout(drillNext,600));return}

  drill.phase='preview';
  midiLight(uniq,0,1);
  state.drillNow=-1;render._k=null;render();

  /* 第二階段：依譜上的節奏依序亮 */
  const preview=Math.max(1200,barSec*450);
  let t=preview;
  let idx=0;
  for(let b=from;b<=to;b++){
    const chords=barChords(kind,b,hand);
    const times=impTimes(song,b,hand);
    const base=(b-from)*barSec*1000;
    chords.forEach(function(ch,i){
      const rel=times[i]!==undefined?times[i]:i/Math.max(1,chords.length);
      const at=preview+base+rel*barSec*1000;
      const my=idx++;
      drill.timers.push(setTimeout(function(){
        if(!state.drillOn)return;
        drill.phase='play';
        state.drillNow=my;state.impBar=b;
        midiLight(ch,0,1);
        if(state.metro&&i===0)tick(true);
        render._k=null;render();},at));
    });
  }
  const total=preview+(to-from+1)*barSec*1000;
  drill.timers.push(setTimeout(drillNext,total+600));
}

function drillNext(){
  if(!state.drillOn)return;
  const song=impCurrent();if(!song)return drillStop();
  const r=drillRange(song);
  if(!state.drillLoop){
    const next=r[1]+1;
    if(next>song.totalBars){drillStop();render._k=null;render();return}
    impSelectBar(song,next);
  }
  drillRun();}

/* 節拍器：短促的高頻點擊，跟琴聲分得開 */
function tick(strong){
  const A=window.AudioContext||window.webkitAudioContext;
  const ctx=playPiano.ctx||(playPiano.ctx=new A());
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type='square';o.frequency.value=strong?1600:1100;
  g.gain.setValueAtTime(.0001,ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(strong?.10:.05,ctx.currentTime+.003);
  g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.06);
  o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.08)}

/* 反覆播放指定小節範圍，一直重複到按停為止。
   練琴真正有效的是重複一小段，而不是從頭到尾彈一遍。 */
function runLoop(song){
  const kind='imp:'+song.id;
  const a=Math.max(1,state.loopA||state.impBar);
  const b=Math.min(song.totalBars,Math.max(a,state.loopB||a));
  let bar=a;
  function playBar(){
    if(!state.looping)return;
    state.impBar=bar;state.impPage=pageForBar(song.pages,bar);state.noteIndex=0;render();
    const gap=Math.max(220,60000/state.bpm/2);
    const hand=state.hand==='both'?'rh':state.hand;
    const cs=barChords(kind,bar,hand);
    const sp=beatSpans(kind,bar,hand);
    const lh=state.hand==='both'?barChords(kind,bar,'lh'):null;
    if(lh&&lh.length)lh[0].forEach(function(n){sound(n,2.5)});
    let i=0;
    (function step(){
      if(!state.looping)return;
      if(i>=cs.length){
        bar=(bar>=b)?a:bar+1;
        setTimeout(playBar,gap);
        return}
      const mult=sp[i]||1;
      if(state.metro)tick(i===0);
      cs[i].forEach(function(n){sound(n,Math.max(.25,gap/1000*mult*0.95))});
      state.noteIndex=i;
      /* 只換高亮，不整頁重繪——重繪會讓畫面閃爍且捲動位置跳掉 */
      const btns=document.querySelectorAll('.flow button');
      btns.forEach(function(el,k){el.classList.toggle('on',k===i)});
      i++;setTimeout(step,gap*mult)})()}
  playBar()}

/* ==================== 自動彈奏播放器 ====================
   把整首（或指定範圍）從頭播到尾，先聽過一遍再自己彈。

   ---------- 為什麼是「分批排程」而不是一次排完 ----------
   Web MIDI 的 output.send(data, timestamp) 可以把事件排到未來的某個時刻，
   節奏會非常準。很容易想到的做法是開播時就把整首曲子（近兩千個事件）
   一次送進輸出埠——聽起來確實準，但「停不下來」：

   - 規格裡的 output.clear() 在 Chrome 沒有實作，呼叫回傳 undefined、實際無效。
   - 送 All Notes Off 只能讓「當下已經響著的音」閉嘴，排在後面的 Note On
     時間一到還是會照樣冒出來，於是按了停止之後音符繼續一顆一顆跑。
   - 唯一真的斷得乾淨的手段是 output.close() 關掉整個埠，但那會讓裝置從
     midiIO.outs 消失，得重新 requestMIDIAccess 才能再用。代價太大。

   所以這裡改成：事件表一次算好（那只是資料，很便宜），但每次只把
   「未來 AUTO_LOOKAHEAD 毫秒內」的事件真的送出去，用 setInterval 續推。
   停止時只要清掉計時器就不會再有新的 send()，剩下的用 All Notes Off 收尾。
   代價是最多還有 AUTO_LOOKAHEAD 這麼長的訊息已經進了驅動程式的佇列，
   所以停止後會再補送一次靜音把窗內漏出來的音收乾淨。 */
const AUTO_TICK=200;        /* 排程器每 200ms 醒來一次 */
const AUTO_LOOKAHEAD=1200;  /* 每次只排未來 1.2 秒的事件；也就是停止的最壞延遲 */
const autoPlay={on:false,paused:false,pausedAt:0,timer:null,mop:null,
  events:[],cursor:0,t0:0,total:0,from:1,to:1,barSec:2,useMidi:false,
  lastBar:0,synthTimers:[]};

/* 這些設定另外補預設值，不去動上面那行 const state=——
   那一行和曲目資料在同一區塊，改它容易和新增曲目的編輯撞在一起 */
if(state.autoFrom===undefined)state.autoFrom=0;   /* 0 代表「整首」 */
if(state.autoTo===undefined)state.autoTo=0;
if(state.autoRh===undefined)state.autoRh=true;
if(state.autoLh===undefined)state.autoLh=true;
if(state.autoSrc===undefined)state.autoSrc='midi';
if(state.autoBeats===undefined)state.autoBeats=4;
if(state.autoFollow===undefined)state.autoFollow=false;

function autoHasOut(){return !!(midiIO.outs&&midiIO.outs.length)}
/* 有輸出埠就預設用琴的音色；沒有就一定退回瀏覽器合成音 */
function autoUseMidi(){return autoHasOut()&&state.autoSrc!=='synth'}
function autoRange(song){
  let a=Number(state.autoFrom)||1;
  let b=Number(state.autoTo)||song.totalBars;
  a=Math.max(1,Math.min(song.totalBars,a));
  b=Math.max(a,Math.min(song.totalBars,b));
  return [a,b]}
/* 速度沿用 state.bpm。一小節幾拍決定每小節幾秒 */
function autoBarSec(){
  const beats=Number(state.autoBeats)||4;
  return beats*60/Math.max(20,Number(state.bpm)||36)}
function autoMMSS(sec){const s=Math.round(sec);
  return s>=60?Math.floor(s/60)+' 分 '+(s%60)+' 秒':s+' 秒'}

/* ---------- 事件表 ----------
   每個和弦的起點用譜上量到的相對位置 rt/lt（0~1）換算成小節內的秒數，
   所以節奏跟原譜的比例間距一致，不是等間隔的機器人節奏。

   時值一律算到「同一隻手的下一個和弦」為止，最後一個算到小節結尾。
   左手常常是一個撐滿整小節的長音、右手在上面彈好幾顆——若給左手固定時值，
   它會提早斷掉，聽起來像根本沒按。 */
function autoBuildEvents(kind,from,to,barSec,opts){
  const song=impSong(kind.slice(4));
  if(!song)return [];
  const hands=[];
  if(opts.rh)hands.push('rh');
  if(opts.lh)hands.push('lh');
  const events=[];
  for(let bar=from;bar<=to;bar++){
    const base=(bar-from)*barSec;
    hands.forEach(function(hand){
      /* 一律走 barChords：移調（純白鍵版）與單音簡化（入門版）都在它裡面。
         直接讀 song.bars 會播出沒有簡化過的原始音符。
         另外 hand 只會是 'rh' / 'lh'——資料裡沒有 'both' 這一欄。 */
      const chords=barChords(kind,bar,hand);
      if(!chords.length)return;
      const times=impTimes(song,bar,hand);
      chords.forEach(function(ch,i){
        const rel=times[i]!==undefined?times[i]:i/chords.length;
        const nextRel=(i+1<chords.length)
          ? (times[i+1]!==undefined?times[i+1]:(i+1)/chords.length)
          : 1;
        const on=base+rel*barSec;
        const dur=Math.max(0.08,(nextRel-rel)*barSec*0.98);
        ch.forEach(function(n){
          if(!n)return;
          events.push({t:on*1000,type:'on',note:n,hand:hand,bar:bar,dur:dur});
          events.push({t:(on+dur)*1000,type:'off',note:n,hand:hand,bar:bar})})})})}
  /* 同一時刻先放掉舊音再按新音，重複同一顆音才不會被自己的 Note Off 掐掉 */
  events.sort(function(a,b){return (a.t-b.t)||(a.type===b.type?0:a.type==='off'?-1:1)});
  return events}

function autoSendAt(bytes,when){
  if(!autoHasOut())return;
  midiIO.outs.forEach(function(o){try{o.send(bytes,when)}catch(e){}})}

/* 停止時的完整靜音序列。少了任何一條都可能有音卡住一直響 */
function autoPanic(){
  if(!autoHasOut())return false;
  midiIO.outs.forEach(function(o){
    for(let ch=0;ch<16;ch++){
      try{
        o.send([0xB0|ch,120,0]);   /* All Sound Off */
        o.send([0xB0|ch,123,0]);   /* All Notes Off */
        o.send([0xB0|ch,64,0]);    /* 放開延音踏板，否則放開的音還會被踏板留住 */
      }catch(e){}}});
  return true}

/* 排程器的一次心跳：把窗內的事件送出去，再更新進度顯示 */
function autoPump(){
  if(!autoPlay.on)return;
  const now=performance.now();
  const horizon=now-autoPlay.t0+AUTO_LOOKAHEAD;
  const evs=autoPlay.events;
  while(autoPlay.cursor<evs.length&&evs[autoPlay.cursor].t<=horizon){
    const ev=evs[autoPlay.cursor++];
    const when=autoPlay.t0+ev.t;
    if(autoPlay.useMidi){
      autoSendAt(ev.type==='on'?[0x90,midi(ev.note),96]:[0x80,midi(ev.note),0],when);
    }else if(ev.type==='on'){
      /* 合成音沒有 Note Off，時值直接交給 playPiano 的音量包絡。
         這裡的 setTimeout 全部記下來，停止時一次清掉。 */
      autoPlay.synthTimers.push(setTimeout(function(){
        if(autoPlay.on)playPiano(ev.note,ev.dur)},Math.max(0,when-now)))}}
  if(autoPlay.synthTimers.length>600)autoPlay.synthTimers=autoPlay.synthTimers.slice(-200);
  autoStatus(now);
  if(autoPlay.cursor>=evs.length&&now-autoPlay.t0>autoPlay.total+300)autoStop();}

/* 進度顯示。絕對不要在這裡呼叫 render()——它會重建整頁 DOM，
   畫面會閃爍、捲動位置也會跳掉。只改幾個小元素的文字與 class。 */
function autoStatus(now){
  const t=(now===undefined?performance.now():now)-autoPlay.t0;
  const span=autoPlay.barSec*1000;
  const count=autoPlay.to-autoPlay.from+1;
  let idx=Math.floor(Math.max(0,t)/span);
  if(idx>count-1)idx=count-1;
  const bar=autoPlay.from+idx;
  const beats=Number(state.autoBeats)||4;
  let beat=Math.floor((Math.max(0,t)-idx*span)/span*beats)+1;
  if(beat<1)beat=1;
  if(beat>beats)beat=beats;
  const el=document.getElementById('autoStatus');
  if(el)el.innerHTML=(t<0?'<b>準備中…</b>':'<b>第 '+bar+' 小節</b>　第 '+beat+' ／ '+beats+' 拍')
    +'<small>播放範圍 '+autoPlay.from+'–'+autoPlay.to+' 小節　·　'
    +(autoPlay.useMidi?'琴的音色（MIDI）':'瀏覽器合成音')+'　·　'
    +(state.autoRh&&state.autoLh?'雙手':state.autoRh?'只有右手':'只有左手')+'</small>';
  const tr=document.getElementById('autoTrack');
  if(tr)tr.style.width=Math.max(0,Math.min(100,t/Math.max(1,autoPlay.total)*100))+'%';
  if(bar!==autoPlay.lastBar){
    autoPlay.lastBar=bar;
    document.querySelectorAll('.measure-grid button.playing').forEach(function(b){b.classList.remove('playing')});
    const cell=document.querySelector('.measure-grid button[data-action="measure"][data-bar="'+bar+'"]');
    if(cell){
      cell.classList.add('playing');
      /* 預設不捲動：彈琴時兩手都在琴上，畫面自己動反而找不到位置 */
      if(state.autoFollow)cell.scrollIntoView({block:'nearest'})}}}

/* 停掉計時器並靜音，但保留事件表——暫停與停止共用 */
function autoHalt(){
  autoPlay.on=false;
  if(autoPlay.timer){clearInterval(autoPlay.timer);autoPlay.timer=null}
  autoPlay.synthTimers.forEach(function(id){clearTimeout(id)});
  autoPlay.synthTimers=[];
  autoPanic();
  /* 已經進了驅動程式佇列的訊息取消不掉（Chrome 沒有 output.clear()），
     等 lookahead 過完再補一次靜音，把窗內漏出來的音收乾淨。
     若這期間又按了播放就跳過，免得把新的一輪也掐掉。 */
  if(autoPlay.mop)clearTimeout(autoPlay.mop);
  autoPlay.mop=setTimeout(function(){if(!autoPlay.on)autoPanic()},AUTO_LOOKAHEAD+200)}

function autoStop(redraw){
  const was=autoPlay.on||autoPlay.paused;
  autoHalt();
  autoPlay.paused=false;autoPlay.pausedAt=0;
  autoPlay.events=[];autoPlay.cursor=0;autoPlay.lastBar=0;
  document.querySelectorAll('.measure-grid button.playing').forEach(function(b){b.classList.remove('playing')});
  const tr=document.getElementById('autoTrack');if(tr)tr.style.width='0%';
  if(was&&redraw!==false)render()}

function autoPause(){
  if(!autoPlay.on)return;
  const at=performance.now()-autoPlay.t0;
  autoPlay.pausedAt=at;autoPlay.paused=true;
  autoHalt();
  /* 已排進 lookahead 但還沒響就被靜音的事件，指標倒回去，續播才不會缺一段 */
  while(autoPlay.cursor>0&&autoPlay.events[autoPlay.cursor-1].t>=at)autoPlay.cursor--;
  render()}

function autoResume(){
  if(!autoPlay.paused||!autoPlay.events.length)return;
  autoPlay.paused=false;autoPlay.on=true;
  render();
  autoPlay.t0=performance.now()-autoPlay.pausedAt+120;
  autoPump();
  autoPlay.timer=setInterval(autoPump,AUTO_TICK)}

function autoStart(){
  const song=impCurrent();
  if(!song)return;
  autoStop(false);
  if(!state.autoRh&&!state.autoLh)state.autoRh=true;
  const kind='imp:'+song.id;
  const r=autoRange(song);
  const barSec=autoBarSec();
  autoPlay.from=r[0];autoPlay.to=r[1];autoPlay.barSec=barSec;
  autoPlay.events=autoBuildEvents(kind,r[0],r[1],barSec,{rh:state.autoRh,lh:state.autoLh});
  autoPlay.cursor=0;autoPlay.lastBar=0;
  autoPlay.total=(r[1]-r[0]+1)*barSec*1000;
  autoPlay.useMidi=autoUseMidi();
  autoPlay.on=true;
  render();                            /* 整頁重繪只在開始／停止各一次 */
  /* render() 之後才對時：重建整頁 DOM 要花時間，先對時的話第一顆音會被吃掉 */
  autoPlay.t0=performance.now()+260;
  autoPump();
  autoPlay.timer=setInterval(autoPump,AUTO_TICK)}

function autoTipHtml(song){
  const r=autoRange(song),sec=autoBarSec();
  return '目前速度 ♩ = '+state.bpm+'，一小節 '+(Number(state.autoBeats)||4)+' 拍 ≈ '+sec.toFixed(1)+' 秒。'
    +'這段共 '+(r[1]-r[0]+1)+' 小節、約 '+autoMMSS((r[1]-r[0]+1)*sec)+'。'
    +'播放中改速度不會立刻生效，要重新按開始。'
    +(autoHasOut()?'':'（目前偵測不到 MIDI 輸出埠，會用瀏覽器合成音發聲。）')}

function autoPanel(song,bar){
  const r=autoRange(song);
  const has=autoHasOut(),useMidi=autoUseMidi();
  const on=autoPlay.on,paused=autoPlay.paused;
  return '<div class="auto">'
    +'<div class="auto-head"><b>自動彈奏播放器</b><span>先整首聽一遍，再照著數字彈</span></div>'
    +'<div class="auto-row"><label>從第</label>'
    +'<input data-action="auto-from" type="number" min="1" max="'+song.totalBars+'" value="'+r[0]+'">'
    +'<label>小節　播到第</label>'
    +'<input data-action="auto-to" type="number" min="1" max="'+song.totalBars+'" value="'+r[1]+'">'
    +'<label>小節</label></div>'
    +'<div class="auto-opts">'
    +'<button data-action="auto-all">整首（1–'+song.totalBars+'）</button>'
    +'<button data-action="auto-here">從第 '+bar+' 小節起</button>'
    +'<button data-action="auto-loop">套用反覆範圍</button></div>'
    +'<div class="auto-opts">'
    +'<button class="'+(state.autoRh?'on':'')+'" data-action="auto-rh">'+(state.autoRh?'✓ ':'')+'右手（旋律）</button>'
    +'<button class="'+(state.autoLh?'on':'')+'" data-action="auto-lh">'+(state.autoLh?'✓ ':'')+'左手（伴奏）</button></div>'
    +'<div class="auto-opts">'
    +'<button class="'+(useMidi?'on':'')+'" data-action="auto-src" data-src="midi"'+(has?'':' disabled')+'>'
    +(useMidi?'✓ ':'')+'用琴的音色（MIDI）</button>'
    +'<button class="'+(useMidi?'':'on')+'" data-action="auto-src" data-src="synth">'
    +(useMidi?'':'✓ ')+'瀏覽器合成音</button></div>'
    +'<div class="auto-opts">'
    +'<button class="'+(Number(state.autoBeats)===4?'on':'')+'" data-action="auto-beats" data-beats="4">一小節 4 拍</button>'
    +'<button class="'+(Number(state.autoBeats)===3?'on':'')+'" data-action="auto-beats" data-beats="3">一小節 3 拍</button>'
    +'<button class="'+(state.autoFollow?'on':'')+'" data-action="auto-follow">'+(state.autoFollow?'✓ ':'')+'畫面跟著跑</button></div>'
    +'<div class="auto-go">'
    +'<button class="main'+(on?' on':'')+'" data-action="auto-play">'
    +(on?'❚❚ 暫停':paused?'▶ 繼續播放':'▶ 開始自動彈奏')+'</button>'
    +'<button data-action="auto-stop"'+(on||paused?'':' disabled')+'>■ 停止</button></div>'
    +'<div class="auto-status" id="autoStatus">'
    +(on?'<b>準備中…</b>':paused?'<b>已暫停</b>':'尚未播放')+'</div>'
    +'<div class="auto-track"><i id="autoTrack" style="width:0%"></i></div>'
    +'<p class="auto-tip" id="autoTip">'+autoTipHtml(song)+'</p>'
    +'</div>'}

/* 自成一個 listener，不去動上面那個既有的大 click 處理器 */
document.addEventListener('click',function(e){
  const b=e.target.closest&&e.target.closest('button');
  if(!b)return;
  const a=b.dataset.action||'';
  if(a.slice(0,5)!=='auto-')return;
  const song=impCurrent();
  if(!song)return;
  if(a==='auto-play'){
    if(autoPlay.on)autoPause();
    else if(autoPlay.paused)autoResume();
    else autoStart();
    return}
  if(a==='auto-stop'){autoStop();return}
  if(a==='auto-all'){state.autoFrom=1;state.autoTo=song.totalBars}
  if(a==='auto-here'){state.autoFrom=state.impBar;
    if(!state.autoTo||state.autoTo<state.impBar)state.autoTo=song.totalBars}
  if(a==='auto-loop'){state.autoFrom=state.loopA||state.impBar;
    state.autoTo=Math.max(state.autoFrom,state.loopB||state.autoFrom)}
  if(a==='auto-rh'){state.autoRh=!state.autoRh;if(!state.autoRh&&!state.autoLh)state.autoLh=true}
  if(a==='auto-lh'){state.autoLh=!state.autoLh;if(!state.autoRh&&!state.autoLh)state.autoRh=true}
  if(a==='auto-src')state.autoSrc=b.dataset.src;
  if(a==='auto-beats')state.autoBeats=Number(b.dataset.beats);
  if(a==='auto-follow')state.autoFollow=!state.autoFollow;
  save();render()});

/* 起訖小節用 input 事件即時記錄，但刻意不 render——
   重繪會把輸入框整個換掉，數字才打一半就失去焦點 */
document.addEventListener('input',function(e){
  const t=e.target;
  if(!t||!t.dataset)return;
  const a=t.dataset.action;
  if(a!=='auto-from'&&a!=='auto-to')return;
  const song=impCurrent();
  if(!song)return;
  const v=Math.max(1,Math.min(song.totalBars,Number(t.value)||1));
  if(a==='auto-from'){state.autoFrom=v;if(state.autoTo&&state.autoTo<v)state.autoTo=v}
  else{state.autoTo=v;if(state.autoFrom&&state.autoFrom>v)state.autoFrom=v}
  save();
  const tip=document.getElementById('autoTip');
  if(tip)tip.innerHTML=autoTipHtml(song)});

/* 換曲目就停播。用捕獲階段，才會排在既有那個會呼叫 render() 的 change 之前，
   否則面板會停在「播放中」的樣子 */
document.addEventListener('change',function(e){
  if(e.target&&e.target.id==='songSelect'&&(autoPlay.on||autoPlay.paused))autoStop(false)},true);

function impSelectBar(song,bar){
  state.impBar=Math.max(1,Math.min(song.totalBars,bar));
  state.impPage=pageForBar(song.pages,state.impBar);
  state.noteIndex=0}

function measureCatalog(pages,bar,kind,total){const keyMode=hasBarNotes(kind);
  /* 資料只有 rh / lh 兩欄。雙手模式下若直接拿 state.hand 去查會得到空陣列，
     整個目錄會變成一整片「休」——目錄空間有限，這裡固定顯示右手旋律。 */
  const catHand=state.hand==='both'?'rh':state.hand;
  return '<section class="panel catalog" id="catalog"><div class="catalog-head"><div><p class="eyebrow">完整練習目錄</p><h2>全曲 <em>'+total+' 個小節</em>，<br>一次全部列出。</h2><p>每個方格都能點選；點選後會同步到正確曲譜頁面。</p></div><div class="count"><b>'+total+'</b><span>／'+total+' 已列出</span><small>目前：第 '+bar+' 小節</small></div></div>'+pages.map(function(p,pi){let buttons='';for(let n=p.start;n<=p.end;n++){buttons+='<button class="'+(n===bar?'selected ':'')+(kind==='merry'&&n===1?'guided':'')+(function(){
    /* 練過的小節在目錄裡用顏色標出來，一眼看得到整體進度 */
    if(kind.slice(0,4)!=='imp:')return '';
    const sg=impSong(kind.slice(4));
    const lv=sg&&state.progress[sg.id]?state.progress[sg.id][n]:0;
    return lv===2?' lv2':lv===1?' lv1':''})()
+'" data-action="measure" data-kind="'+kind+'" data-bar="'+n+'">'
+(keyMode
  /* 有音符資料的曲子直接把要按的琴鍵編號列出來，小節號退成小字——
     照著數字按就能彈，不必先讀懂五線譜。 */
  ? '<small class="kc-bar">第 '+n+' 小節 · P'+(pi+1)+(state.hand==='both'?' · 右手':'')+'</small>'+chipRow(barChords(kind,n,catHand))
  : '<small>P'+(pi+1)+'</small><b>'+n+'</b><span>'+barTag(kind,n)+'</span>')
+'</button>'}return '<article class="page-block '+(bar>=p.start&&bar<=p.end?'active':'')+'"><div class="page-label"><div><small>第 '+(pi+1)+' 頁</small><b>'+p.title+'</b></div><span>小節 '+p.start+'–'+p.end+'</span></div><div class="measure-grid '+(keyMode?'keys':'')+'">'+buttons+'</div></article>'}).join('')+'<div class="sticky-choice"><div><small>你目前選擇</small><b>第 '+bar+' 小節 · 第 '+(pageForBar(pages,bar)+1)+' 頁</b></div><button data-action="scroll-score">查看對應曲譜 ↓</button></div></section>'}
function lifeSteps(bar){return DATA.lifelongBars[bar-1].map(function(d){return{degree:d,note:DEGREE_NOTE[d]}})}
function renderLife(){const steps=lifeSteps(state.lifeBar).map(function(s,i){return{degree:s.degree,note:barNotes('life',state.lifeBar,'rh')[i]||s.note}}),current=steps[state.noteIndex%steps.length];return measureCatalog(DATA.lifelongPages,state.lifeBar,"life",114)+scorePanel(DATA.lifelongPages,state.lifePage,"life","一生所愛完整原譜")+'<section class="panel"><div class="practice-box"><p class="eyebrow">逐小節數字練習</p><h2>第 '+state.lifeBar+' 小節</h2><div class="notice">大數字是 88 鍵電鋼琴的白鍵編號（白鍵 1–52，中央 C 是 24）。</div>'+whiteToggle('life')+'<div class="current-note"><strong>'+numberLabel(current.note)+'</strong><div><b>請按'+keyLabel(current.note)+'</b><small>簡譜 '+degreeLabel(current.degree)+' · 音名 '+current.note+'</small></div></div><div class="flow">'+steps.map(function(s,i){return '<button class="'+(i===state.noteIndex?'on':'')+'" data-action="life-note" data-index="'+i+'"><b>'+numberLabel(s.note)+'</b><small>'+degreeLabel(s.degree)+'</small></button>'}).join('')+'</div></div>'+keyboard(current.note,steps.map(function(s){return s.note}))+'<div class="score-controls"><button data-action="life-prev" '+(state.lifeBar===1?'disabled':'')+'>← 上一小節</button><button class="main" data-action="life-listen">▶ 播放本小節</button><button data-action="life-next" '+(state.lifeBar===114?'disabled':'')+'>下一小節 →</button></div></section>'}
/* 匯入的曲目動態加進上方切換列（內建那兩首是寫死在 HTML 裡的） */
/* 曲目下拉選單。選項要寫清楚難度差異，否則選了也不知道自己在練哪一版 */
function songOptions(){
  const list=orderedSongs().map(function(s){
    const full=impSong(s.id);if(!full)return null;
    return {value:'imp:'+s.id, title:full.title, bars:full.totalBars,
      tag:full.melodyOnly?'只用白鍵 · 旋律單音 · 最好上手'
         :full.whiteOnly?'只用白鍵 · 旋律含八度雙音'
         :full.key+' · 含黑鍵'};
  }).filter(Boolean);
  list.push({value:'lifelong', title:'一生所愛', bars:114, tag:'1＝G'});
  return list}

/* 曲目選單現在由抽屜自己渲染（songPicker），這裡不用再做事 */
function buildSongSwitch(){}

document.addEventListener('change',function(e){
  if(e.target&&e.target.id==='songSelect'){
    /* 換曲目要回到開頭。沿用上一首的小節數／頁碼在曲子長度不同時會指到不存在的地方 */
    state.song=e.target.value;state.noteIndex=0;state.impBar=1;state.impPage=0;
    state.loopA=0;state.loopB=0;state.drawer=false;
    render()}});

function render(){

  app.innerHTML=state.song.slice(0,4)==='imp:'?renderImported():renderLife();
  save();
  /* 換到不同的音才送點燈訊號。render 會因為各種原因重跑，
     每次都送的話琴會被訊息洗版。 */
  const k=state.song+'/'+state.impBar+'/'+state.noteIndex+'/'+state.hand;
  if(state.lightKeys&&k!==render._k){render._k=k;lightCurrent()}}
function selectMeasure(kind,bar){if(kind.slice(0,4)==='imp:'){const s=impSong(kind.slice(4));if(s)impSelectBar(s,bar);render();return}state.lifeBar=Math.max(1,Math.min(114,bar));state.lifePage=pageForBar(DATA.lifelongPages,state.lifeBar);state.noteIndex=0;render()}
document.addEventListener('click',function(event){const button=event.target.closest('button');if(!button)return;if(button.dataset.song){state.song=button.dataset.song;state.noteIndex=0;render();return}const action=button.dataset.action;if(!action)return;if(action==='measure')selectMeasure(button.dataset.kind,Number(button.dataset.bar));if(action==='page'){const kind=button.dataset.kind,index=Number(button.dataset.page);if(kind.slice(0,4)==='imp:'){const s=impSong(kind.slice(4));if(s&&index>=0&&index<s.pages.length){state.impPage=index;state.impBar=s.pages[index].start;state.noteIndex=0}render();return}if(kind==='life'&&index>=0&&index<DATA.lifelongPages.length){state.lifePage=index;state.lifeBar=DATA.lifelongPages[index].start;state.noteIndex=0}render()}if(action==='scroll-score')document.getElementById('score').scrollIntoView({behavior:'smooth'});if(action==='zoom'){state.zoom=!state.zoom;render();document.getElementById('score').scrollIntoView()}if(action==='key'){sound(button.dataset.note)}if(action==='life-note'){state.noteIndex=Number(button.dataset.index);const s=lifeSteps(state.lifeBar)[state.noteIndex];sound(s.note);render()}if(action==='life-prev')selectMeasure('life',state.lifeBar-1);if(action==='life-next')selectMeasure('life',state.lifeBar+1);if(action==='life-listen'){const steps=lifeSteps(state.lifeBar);let i=0;function next(){if(i>=steps.length)return;sound(steps[i].note);i++;setTimeout(next,650)}next()}
if(action==='white'){state.white=!state.white;state.noteIndex=0;render()}
if(action==='metro'){state.metro=!state.metro;render()}
if(action==='mode'){
  state.mode=button.dataset.mode;
  if(state.mode==='practice'){
    /* 進練習模式就把琴鍵指引打開，並確保 MIDI 已連上——
       使用者要的是「按下去就能練」，不是再去翻設定 */
    if(midiIO.outs&&midiIO.outs.length)state.lightKeys=true;
    else if(midiIO.status==='idle')midiConnect();
    if(typeof autoStop==='function'&&autoPlay&&autoPlay.on)autoStop();
  }
  render._k=null;render()}
if(action==='light-again'){render._k=null;lightCurrent()}
if(action==='drill'){
  if(state.drillOn){drillStop();render._k=null;render()}
  else{
    state.drillOn=true;state.noteIndex=0;state.wrong=0;
    if(midiIO.outs&&midiIO.outs.length)state.lightKeys=true;
    drillRun();}}
if(action==='drill-bars'){
  state.drillBars=Number(button.dataset.n)||1;
  if(state.drillOn)drillRun(); else render()}
if(action==='drill-loop'){state.drillLoop=!state.drillLoop;render()}
if(action==='drawer'){state.drawer=true;render()}
if(action==='drawer-close'){state.drawer=false;render()}
if(action==='midi-connect')midiConnect();
if(action==='midi-oct'){state.ignoreOctave=!state.ignoreOctave;render()}
if(action==='midi-auto'){state.autoAdvance=!state.autoAdvance;render()}
if(action==='midi-reset'){state.hit=0;state.miss=0;state.wrong=0;render()}
/* 清掉防抖記錄讓 render 重送一次即可，別自己再呼叫一遍——會送出重複訊息 */
if(action==='midi-light'){state.lightKeys=!state.lightKeys;render._k=null;render()}
if(action==='midi-sound'){state.useKeyboardSound=!state.useKeyboardSound;render()}
/* 掃過全部 16 個 MIDI channel。有些琴的鍵盤燈只吃特定 channel（不一定是 1），
   只送一個 channel 的話，燈明明能亮也會被誤判成不支援。
   velocity 1 幾乎不發聲，所以連送 16 次不會吵。 */
if(action==='midi-test'){
  state.lightTested=true;
  const n=midi('C4');
  for(let ch=0;ch<16;ch++){
    (function(c){
      setTimeout(function(){
        midiSend([0x90|c,n,1]);
        setTimeout(function(){midiSend([0x80|c,n,0])},1200)},c*90)})(ch)}
  render()}
if(action==='mark'){const s=impCurrent();if(s){
  if(!state.progress[s.id])state.progress[s.id]={};
  state.progress[s.id][state.impBar]=Number(button.dataset.lv);
  /* 同一首譜的三個難度版本共用進度——練熟的是那個小節，不是那個版本 */
  const base=s.derivedFrom||s.id;
  IMPORTED_SONGS.forEach(function(o){
    if(o.id===base||o.derivedFrom===base){
      if(!state.progress[o.id])state.progress[o.id]={};
      state.progress[o.id][state.impBar]=Number(button.dataset.lv)}});
  render()}}
if(action==='loop-a'){state.loopA=state.impBar;if(state.loopB<state.loopA)state.loopB=state.loopA;render()}
if(action==='loop-b'){state.loopB=state.impBar;if(!state.loopA||state.loopA>state.loopB)state.loopA=state.loopB;render()}
if(action==='loop-play'){
  if(state.looping){state.looping=false;render()}
  else{const s=impCurrent();if(s){state.looping=true;render();runLoop(s)}}}
if(action==='imp-hand'){state.hand=button.dataset.hand;state.noteIndex=0;render()}
if(action==='imp-swap'){state.hand=state.hand==='rh'?'lh':'rh';state.noteIndex=0;render()}
if(action==='imp-note'){const s=impCurrent();if(s){state.noteIndex=Number(button.dataset.index);
  if(state.hand==='both'){
    const st=twoHandSteps('imp:'+s.id,state.impBar)[state.noteIndex];
    if(st){
      (st.rh||[]).forEach(function(n){sound(n)});
      /* 左手就算這一拍是「壓著不動」，試聽時仍要發聲，否則聽不出兩手合起來的樣子 */
      (st.lh||[]).forEach(function(n){sound(n,1.2)});
    }
  }else{
    (barChords('imp:'+s.id,state.impBar,state.hand)[state.noteIndex]||[]).forEach(function(n){sound(n)});
  }
  render()}}
if(action==='imp-bar'){const s=impCurrent();if(s){impSelectBar(s,Number(button.dataset.bar));render()}}
/* 一次播一個「時間點」，該時間點的音同時發聲。逐音播放會把八度雙音
   變成快速的八度跳躍，聽起來完全不像原曲。 */
if(action==='imp-listen'){const s=impCurrent();if(s){
  const gap=Math.max(220,60000/state.bpm/2);let i=0;
  if(state.hand==='both'){
    const steps=twoHandSteps('imp:'+s.id,state.impBar);
    const sp=beatSpans('imp:'+s.id,state.impBar,steps.length&&steps[0].rh!==null?'rh':'lh');
    (function next(){
      if(i>=steps.length)return;
      const st=steps[i];
      const mult=sp[i]||1;
      (st.rh||[]).forEach(function(n){sound(n,Math.max(.25,gap/1000*mult*0.95))});
      /* 左手只在真的換和弦那一拍按下去，但要讓它一直響到下次換和弦為止。
         若照右手的節奏每拍都重敲，或用預設的 0.55 秒就斷掉，
         左手聽起來會像沒按一樣。 */
      if(st.lhNew&&st.lh&&st.lh.length){
        let hold=1;
        for(let k=i+1;k<steps.length&&!steps[k].lhNew;k++)hold++;
        let span=0;
        for(let k=i;k<i+hold&&k<steps.length;k++)span+=(sp[k]||1);
        st.lh.forEach(function(n){sound(n,Math.max(.6,span*gap/1000*0.98))});
      }
      i++;setTimeout(next,gap*mult)})();
  }else{
    const cs=barChords('imp:'+s.id,state.impBar,state.hand);
    /* 依真實時值播放。等間隔播出來的節奏是平的，聽起來不像原曲——
       長音要拖、短音要快，這才是這首曲子的樣子。 */
    const sp=beatSpans('imp:'+s.id,state.impBar,state.hand);
    (function next(){
      if(i>=cs.length)return;
      const mult=sp[i]||1;
      const hold=gap/1000*mult*0.95;
      cs[i].forEach(function(n){sound(n,Math.max(.25,hold))});
      i++;setTimeout(next,gap*mult)})();
  }}}
if(action==='imp-listen-both'){const s=impCurrent();if(s){const gap=Math.max(220,60000/state.bpm/2);
  const steps=twoHandSteps('imp:'+s.id,state.impBar);let i=0;
  (function next(){
    if(i>=steps.length)return;
    const st=steps[i];
    (st.rh||[]).forEach(function(n){sound(n)});
    if(st.lhNew&&st.lh&&st.lh.length){
      let hold=1;
      for(let k=i+1;k<steps.length&&!steps[k].lhNew;k++)hold++;
      st.lh.forEach(function(n){sound(n,Math.max(.6,hold*gap/1000*0.98))});
    }
    i++;setTimeout(next,gap)})()}}
});
document.addEventListener('input',function(event){if(event.target.dataset.action==='tempo'){state.bpm=Number(event.target.value);render()}});
buildSongSwitch();
render();
</script>
</body>
</html>
